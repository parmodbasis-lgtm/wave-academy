main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--bad);padding:6px 8px}
button:disabled{opacity:.5}
button.gold{background:linear-gradient(135deg,#fff3b0 0%,#f5c518 30%,#c99700 55%,#ffe27a 80%,#e0aa00 100%);color:#3a2800;border:1px solid #b88a00;font-weight:700;box-shadow:0 2px 5px rgba(120,90,0,.3),inset 0 1px 2px rgba(255,255,255,.7)}button.gold.on{outline:3px solid #3a2800;outline-offset:1px}button.bg{background:#1d4ed8;color:#ffe9a6;font-weight:700;border-radius:12px;padding:12px 18px}.idl{background:linear-gradient(145deg,#ffffff,#cfe0d5);border-radius:22px;padding:12px 12px 6px;margin:12px 0 4px;border:1px solid #bcd0c4;box-shadow:9px 9px 18px rgba(0,0,0,.28),-6px -6px 14px rgba(255,255,255,.95),inset 0 1px 3px #fff,inset 0 -3px 6px rgba(0,0,0,.08)}.idl img,.idl .ph{box-shadow:0 8px 12px rgba(0,0,0,.4),0 0 0 3px #fff}button.bl{background:#1d4ed8;color:#fff;border-radius:10px;padding:11px 4px;font-size:15px;line-height:1.2;min-width:0}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 button{width:100%}.wt{display:block;width:100%;overflow:hidden;font-size:30px;font-weight:800;margin:0;white-space:nowrap;line-height:1.15;background:linear-gradient(90deg,#1d4ed8,#7c3aed 55%,#c99700);-webkit-background-clip:text;background-clip:text;color:transparent}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=email],input[type=datetime-local],textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:600;z-index:5}
.qb{border:1px dashed var(--bd);border-radius:10px;padding:12px;margin:10px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.big{font-size:40px;font-weight:700;color:var(--ac)}
textarea{resize:vertical}.qimg{max-width:100%;border-radius:8px;display:block;margin:8px 0}.oimg{max-width:100%;max-height:160px;border-radius:6px;display:block;margin-top:6px}.pv{padding:2px 4px;overflow-x:auto}.mkbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;padding:4px 0}.mkgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:6px}.mkb{padding:6px 10px;background:var(--ac2);color:var(--ac);min-width:40px}
.pill{border-radius:20px;padding:9px 14px;color:#fff;margin:4px 6px 4px 0}.pill.ok{background:#1d4ed8}.pill.no{background:#8b0000}.pill.stk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;position:relative;margin:0 0 12px;padding:10px 16px;font:600 26px/1.2 'Caveat','Segoe Script','Bradley Hand',cursive;color:#fff;border:0;text-align:left;border-radius:16px}.pill.stk .sc{font-size:22px;white-space:nowrap}.pill.stk .st{position:absolute;top:-10px;right:-4px;font-size:24px;line-height:1}.gbox{background:linear-gradient(135deg,#fff3b0 0%,#f5c518 30%,#c99700 55%,#ffe27a 80%,#e0aa00 100%);color:#3a2800;border-radius:16px;border:1px solid #b88a00;box-shadow:0 2px 6px rgba(120,90,0,.35),inset 0 1px 2px rgba(255,255,255,.7);min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px}.gbox .big{font-size:28px;font-weight:800;color:#3a2800}.gbox .l{font-size:14px;font-weight:600;margin-top:4px;line-height:1.25}.nvbar{display:flex;flex-wrap:wrap;gap:6px}.nv{min-width:40px;padding:8px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.nv.dn{background:var(--ac);color:#fff;border-color:var(--ac)}.nv.cu{outline:2px solid var(--tx);outline-offset:1px}

.card{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,214,90,.55);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.p3d,.idl{background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(207,224,213,.74));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,214,90,.6)}
.tav{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #e0aa00;box-shadow:0 0 0 3px rgba(255,226,122,.45),0 0 18px rgba(245,197,24,.75)}
.tt{font-size:21px;font-weight:700;line-height:1.15;background:linear-gradient(90deg,#8a5a00,#d99a00 50%,#7a4f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tbd{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;background:linear-gradient(135deg,#fff3b0,#f5c518 45%,#c99700);color:#3a2800;font-size:13px;font-weight:700;border:1px solid #b88a00;box-shadow:0 2px 5px rgba(120,90,0,.3)}
.arw{color:#d99a00;font-style:normal;font-weight:900;margin:0 3px}.cln{margin-top:6px;text-align:center;font-weight:700;font-size:15px;color:#7a4f00}.tgl{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(138,90,0,.4);text-align:center;font-size:14px;font-style:normal;color:#3b3f8f;font-weight:600;white-space:nowrap}
.idl .ic img,.idl .ic .ph{border:2px solid #e0aa00;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .25s,box-shadow .25s}

function idolOff(){const b=document.getElementById('ib');if(b){b.classList.remove('on');b.dataset.i=''}document.querySelectorAll('.ic.sel').forEach(x=>x.classList.remove('sel'))}
function idol(i,el){
  const b=document.getElementById('ib');if(!b)return;
  if(b.classList.contains('on')&&b.dataset.i===String(i))return idolOff();
  idolOff();el.classList.add('sel');
  const d=IDDESC[PHYS[i][0]]||[PHYS[i][0],''];
  b.innerHTML='<b>'+esc(d[0])+'</b>'+esc(d[1]).replace(/(\d+)(st|nd|rd|th)\b/g,'$1<sup>$2</sup>')+'<span class="tl"></span>';b.dataset.i=i;b.classList.add('on');
  const P=b.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect(),w=Math.min(P.width-16,270),cx=r.left+r.width/2-P.left;
  b.style.width=w+'px';const left=Math.max(8,Math.min(cx-w/2,P.width-w-8));b.style.left=left+'px';
  b.querySelector('.tl').style.left=(cx-left-7)+'px';b.style.bottom=(P.bottom-r.top+10)+'px';
}

function ytId(u){
  u=(u||'').trim();let m='';
  if(/^[\w-]{11}$/.test(u))return u;
  try{
    const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u),hn=x.hostname.replace(/^(www|m|music)\./,'');
    if(hn==='youtu.be')m=x.pathname.slice(1).split('/')[0];
    else if(hn==='youtube.com'||hn==='youtube-nocookie.com'){
      if(x.pathname==='/watch')m=x.searchParams.get('v')||'';
      else{const p=x.pathname.split('/');if(['embed','shorts','live','v'].includes(p[1]))m=p[2]||''}
    }
  }catch(e){}
  return /^[\w-]{11}$/.test(m||'')?m:'';
}

async function saveLec(){
  const g=id=>document.getElementById(id).value,err=s=>{document.getElementById('lme').textContent=s};
  const title=g('lt').trim(),raw=g('lu').trim(),lid=lc.edit;
  if(!title)return err('Please enter the topic name.');
  let vid='';
  if(raw){vid=ytId(raw);if(!vid)return err('This does not look like a valid YouTube link.')}
  else if(!lid)return err('Please paste the YouTube link.');
  try{
    if(lid){
      if(vid)await db.collection('lectureSrc').doc(lid).set({section:sec,vid});
      await db.collection('lectures').doc(lid).update({title});
    }else{
      const id=nid(),ord=Math.max(0,...lc.lecs.map(l=>l.order||0))+1;
      await db.collection('lectureSrc').doc(id).set({section:sec,vid});
      await db.collection('lectures').doc(id).set({section:sec,chapterId:'',topicId:'',title,order:ord,free:false,published:true,created:Date.now()});
    }
    lc.edit=null;lc.pre=null;lecAdminIn(lc.o);

}

async function docxPre(buf){
  if(typeof JSZip==='undefined')return {buf,n:0,bad:0};
  const z=await JSZip.loadAsync(buf),f=z.file('word/document.xml');if(!f)return {buf,n:0,bad:0};
  const xml=await f.async('string');
  if(xml.indexOf('oMath')<0)return {buf,n:0,bad:0};
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)return {buf,n:0,bad:0};
  let n=0,bad=0;
  const mk=tex=>{const r=doc.createElementNS(W_NS,'w:r'),t=doc.createElementNS(W_NS,'w:t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=tex;r.appendChild(t);return r};
  const conv=el=>{let tex='';try{tex=omToLatex(el)}catch(e){bad++}return tex};
  const paras=Array.from(doc.getElementsByTagNameNS(OM_NS,'oMathPara'));
  paras.forEach(p=>{
    const parts=Array.from(p.childNodes).filter(c=>c.nodeType===1&&c.localName==='oMath').map(conv).filter(Boolean);
    if(!parts.length){p.parentNode.removeChild(p);return}
    n+=parts.length;p.parentNode.replaceChild(mk(' $'+parts.join('$ $')+'$ '),p);
  });
  Array.from(doc.getElementsByTagNameNS(OM_NS,'oMath')).forEach(m=>{
    const tex=conv(m);if(!tex){m.parentNode.removeChild(m);return}
    n++;m.parentNode.replaceChild(mk('$'+tex+'$'),m);
  });
  z.file('word/document.xml',new XMLSerializer().serializeToString(doc));
  return {buf:await z.generateAsync({type:'arraybuffer'}),n,bad};
}

function htmlToLines(html,num){
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),lines=[];
  const txt=n=>{
    if(n.nodeType===3)return n.nodeValue;
    if(n.nodeType!==1)return '';
    const g=n.tagName;
    if(g==='IMG')return '';
    if(g==='BR')return ' ';
    const s=Array.from(n.childNodes).map(txt).join('');
    if(g==='SUP')return s.trim()?'$^{'+s.trim()+'}$':'';
    if(g==='SUB')return s.trim()?'$_{'+s.trim()+'}$':'';
    return s;
  };
  const ctr=[];let pend='';
  const lineOf=(nodes,li)=>{
    let t=nodes.map(txt).join('').replace(/[ \t\r\n ]+/g,' ').trim();const im=[];
    if(pend&&t){if(!/^(?:q(?:uestion)?\.?\s*)?\d{1,3}\s*[\.\)\:\-]|^\(?[A-Da-d]\s*[\.\)]/i.test(t))t=pend+t;pend=''}

    const ims=im.filter(Boolean);
    if(t||ims.length)lines.push({t,im:ims,li});
  };
  const walk=(p,li)=>{
    Array.from(p.childNodes).forEach(c=>{
      if(c.nodeType!==1)return;
      const g=c.tagName;
      if(g==='UL'||g==='OL'){if(num&&g==='OL')ctr.push(0);walk(c,true);if(num&&g==='OL')ctr.pop();return}
      if(g==='LI'){
        if(num&&ctr.length){const k=++ctr[ctr.length-1];pend=ctr.length===1?k+'. ':'('+'abcdefgh'[Math.min(k-1,7)]+') '}
        const inl=[],lst=[];
        Array.from(c.childNodes).forEach(x=>{if(x.nodeType===1&&(x.tagName==='UL'||x.tagName==='OL'))lst.push(x);else inl.push(x)});
        const hasBlk=inl.some(x=>x.nodeType===1&&/^(P|DIV|TABLE)$/.test(x.tagName));
        if(hasBlk){const w=doc.createElement('div');inl.forEach(x=>w.appendChild(x.cloneNode(true)));walk(w,true)}else lineOf(inl,true);
        lst.forEach(l=>{const o=num&&l.tagName==='OL';if(o)ctr.push(0);walk(l,true);if(o)ctr.pop()});
        return;
      }
      if(c.querySelector('p,ul,ol,li,table,div'))return walk(c,li);
      lineOf([c],li);
    });
  };
  walk(doc.body,false);
  return lines;
}
function parseLines(L){

  const hasQ=L.some(l=>kind(l.t)==='q'),hasO=L.some(l=>kind(l.t)==='o');
  const out=[];let cur=null;
  const newQ=t=>{cur={q:t,qi:'',o:[],oi:[],a:-1,closed:false,extra:false};out.push(cur)};
  const addOpt=t=>{if(cur.o.length<4)cur.o.push(t);else cur.extra=true};
  const attach=im=>{
    if(!cur||cur.closed||!im.length)return;
    if(cur.o.length===0){if(!cur.qi)cur.qi=im[0]}else{const j=cur.o.length-1;if(j<4&&!cur.oi[j])cur.oi[j]=im[0]}
  };
  const cont=t=>{if(cur.o.length===0)cur.q+=(cur.q?'\n':'')+t;else{const j=Math.min(cur.o.length,4)-1;cur.o[j]+=' '+t}};

    if(m=t.match(QRE)){newQ(m[2]);attach(l.im);continue}
    if(m=t.match(OPT)||t.match(OPTN)){
      if(!cur||cur.closed){if(!hasQ)newQ('');else continue}
      addOpt(m[2]);attach(l.im);continue;
    }
    if(!cur){if(hasQ)continue;newQ(t);attach(l.im);continue}
    if(cur.closed){if(!hasQ){newQ(t);attach(l.im)}continue}
    if(!hasQ&&!hasO){if(cur.o.length<4)addOpt(t);else newQ(t)}
    else if(hasQ&&!hasO){if(cur.o.length<4)addOpt(t);else cont(t)}
    else if(!hasQ&&hasO){if(cur.o.length>=4)newQ(t);else cont(t)}
    else cont(t);

  }

function shrinkData(src,max){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.7))};im.onerror=rej;im.src=src})}
async function importDocx(inp){
  const f=inp.files[0],st=document.getElementById('impst');if(!f)return;
  if(!/\.docx$/i.test(f.name)){st.textContent='Please choose a .docx file. In Word: File → Save as → Word Document (.docx).';return}
  if(typeof mammoth==='undefined'){st.textContent='Loading the Word reader…';await wordLibs()}
  if(typeof mammoth==='undefined'){st.textContent='The Word reader could not load. Check your internet and reload the app.';return}
  st.textContent='Reading your file…';
  try{
    let skipped=0;
    const ab=await f.arrayBuffer();let eq={n:0,bad:0},use=ab;
    try{eq=await docxPre(ab);use=eq.buf}catch(e){eq={n:0,bad:0};use=ab}
    const r=await mammoth.convertToHtml({arrayBuffer:use},{convertImage:mammoth.images.imgElement(img=>img.read('base64').then(b=>{
      if(!/^image\/(png|jpe?g|gif|bmp|webp)$/.test(img.contentType)){skipped++;return {src:''}}
      return {src:'data:'+img.contentType+';base64,'+b};
    }))});

    if(!qs.length){st.textContent='No questions found. Please check the format shown below.';return}
    st.textContent='Processing pictures…';
    for(const x of qs){
      if(x.qi)x.qi=await shrinkData(x.qi,800).catch(()=>'');
      for(let j=0;j<4;j++)if(x.oi[j])x.oi[j]=await shrinkData(x.oi[j],500).catch(()=>'');
    }
    sync();
    const keep=draft.qs.filter(x=>x.q.trim()||x.qi||x.o.some(v=>v.trim()));
    draft.qs=keep.concat(qs);
    if(!draft.title.trim())draft.title=f.name.replace(/\.docx$/i,'');
    const noA=qs.filter(x=>x.a<0).length,few=qs.filter(x=>x.few).length,ext=qs.filter(x=>x.extra).length,pics=qs.filter(x=>x.qi||x.oi.some(Boolean)).length;
    impMsg='✅ <b>'+qs.length+' questions imported</b>'+(pics?' ('+pics+' with pictures)':'')+'. Please check them below.'
      +(noA?'<br>⚠ '+noA+' question(s) have no answer: select the correct option for each one marked in red.':'')
      +(few?'<br>⚠ '+few+' question(s) have fewer than 4 options: fill in the empty options.':'')
      +(ext?'<br>⚠ '+ext+' question(s) had more than 4 options: only the first 4 were kept.':'')
      +(eq.n?'<br>∑ '+eq.n+' equation(s) converted from Word. Please glance at them in the preview below.':'')+(eq.bad?'<br>⚠ '+eq.bad+' equation(s) could not be converted: please retype them.':'')
      +(skipped?'<br>⚠ '+skipped+' picture(s) could not be read (Word drawings): insert them again as normal pictures.':'');
    drawBuilder();
  }catch(e){st.textContent='Could not read this file: '+(e.message||e)}
}

/* ===== Crackers + confetti when a test ends ===== */
function crackers(){
  try{
    const old=document.getElementById('fxc');if(old)old.remove();
    const c=document.createElement('canvas');c.id='fxc';c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';
    document.body.appendChild(c);
    const dpr=Math.min(window.devicePixelRatio||1,2),W=window.innerWidth,H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const cols=['#ffd84a','#ff5c8a','#4ade80','#38bdf8','#c084fc','#fb923c','#ffffff'],P=[];
    const burst=(cx,cy)=>{const col=cols[Math.random()*cols.length|0],n=54;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,s=2+Math.random()*4.6;P.push({k:'s',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.011+Math.random()*.008,c:col,r:1.8+Math.random()*1.6,g:.055})}};
    const conf=()=>{for(let i=0;i<80;i++)P.push({k:'c',x:Math.random()*W,y:-10-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,l:1,d:.0035,c:cols[Math.random()*cols.length|0],w:6+Math.random()*5,h:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,g:.015})};
    const t0=performance.now(),plan=[0,300,700,1100,1600,2100,2700].map(ms=>({ms,done:false}));let confDone=0;
    conf();
    (function frame(now){
      const e=now-t0;
      plan.forEach(s=>{if(!s.done&&e>=s.ms){s.done=true;burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4));if(s.ms===1100&&!confDone){confDone=1;conf()}}});
      x.clearRect(0,0,W,H);
      for(let i=P.length-1;i>=0;i--){
        const q=P[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.l-=q.d;
        if(q.k==='s'){q.vx*=.985}else{q.a+=q.va;q.vx*=.99}
        if(q.l<=0||q.y>H+20){P.splice(i,1);continue}
        x.globalAlpha=Math.max(0,Math.min(1,q.l*1.4));x.fillStyle=q.c;
        if(q.k==='s'){x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill()}
        else{x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()}
      }
      if(e<5200||P.length)requestAnimationFrame(frame);else c.remove();
    })(t0);
    setTimeout(()=>{if(c.parentNode)c.remove()},9000);

  try{await refreshMine()}catch(e){}
  if(!timer&&!draft){const y=window.scrollY;home();window.scrollTo(0,y)}
});
