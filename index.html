<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wave Academy</title>
<style>
:root{--bg:#e8f1ea;--card:#f9fcf9;--tx:#1b1f2a;--mut:#667085;--ac:#4f46e5;--ac2:#eef0ff;--bd:#cfdfd4;--ok:#12805c;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#17241f;--tx:#eceef5;--mut:#9aa1b2;--ac:#8b85ff;--ac2:#25294a;--bd:#2a3b33;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#17241f;--tx:#eceef5;--mut:#9aa1b2;--ac:#8b85ff;--ac2:#25294a;--bd:#2a3b33;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--bad);padding:6px 8px}
button:disabled{opacity:.5}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=email],input[type=datetime-local],textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:600;z-index:5}
.qb{border:1px dashed var(--bd);border-radius:10px;padding:12px;margin:10px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.big{font-size:40px;font-weight:700;color:var(--ac)}
textarea{resize:vertical}.qimg{max-width:100%;border-radius:8px;display:block;margin:8px 0}.oimg{max-width:100%;max-height:160px;border-radius:6px;display:block;margin-top:6px}.pv{padding:2px 4px;overflow-x:auto}.mkbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;padding:4px 0}.mkgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:6px}.mkb{padding:6px 10px;background:var(--ac2);color:var(--ac);min-width:40px}
.pill{border-radius:20px;padding:9px 14px;color:#fff;margin:4px 6px 4px 0}.pill.ok{background:#1f9d55}.pill.no{background:#d64545}.nvbar{display:flex;flex-wrap:wrap;gap:6px}.nv{min-width:40px;padding:8px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.nv.dn{background:var(--ac);color:#fff;border-color:var(--ac)}.nv.cu{outline:2px solid var(--tx);outline-offset:1px}
#pp{display:none}
@media print{html,body{background:#fff!important}body>*:not(#pp){display:none!important}#pp{display:block!important;color:#000;background:#fff;font:14px/1.5 Georgia,serif;padding:0}#pp .pq{break-inside:avoid;margin:0 0 14px}#pp .pop{margin:2px 0 2px 18px}#pp img{max-width:100%;max-height:220px}#pp .oimg{max-height:90px}#pp h1{font-size:20px;text-align:center;margin:0}#pp .pc{text-align:center;margin:2px 0}#pp hr{border:0;border-top:1.5px solid #000;margin:8px 0 14px}#pp .pk{break-before:page}#pp table{border-collapse:collapse}#pp td,#pp th{border:1px solid #000;padding:3px 10px}}
</style>

const banner=()=>`<div class="row" style="gap:12px;margin:10px 0 4px;flex-wrap:nowrap"><img src="${TEACHER}" alt="" width="56" height="56" style="border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--ac)"><div style="line-height:1.35"><div class="mut" style="font-size:12px">Taught by</div><b>${TNAME}</b><div class="mut" style="font-size:13px">${TROLE}</div></div></div><div style="display:flex;gap:12px;overflow-x:auto;padding:8px 0">${PHYS.map(x=>`<div style="text-align:center;flex:none;width:76px">${x[2]?`<img src="${x[2]}" alt="" width="48" height="48" style="border-radius:50%;object-fit:cover">`:`<div style="width:48px;height:48px;border-radius:50%;background:${x[1]};color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto">${esc(x[0].replace(/[^A-Z]/g,'').slice(0,2)||x[0][0])}</div>`}<div class="mut" style="font-size:11px;margin-top:3px">${esc(x[0])}</div></div>`).join('')}</div>`;
let myEmail='',myClass='',mySec='',stab='tests';
const CLS={IX:'Class IX',X:'Class X',XI:'Physics XI',XII:'Physics XII'};
const logoTop=()=>`<div style="text-align:center;margin-top:24px"><img src="${LOGO}" width="96" height="96" style="border-radius:50%" alt=""><h1>The Wave Academy</h1><p class="mut">Online Tests</p></div>${banner()}`;
const clsOpts=()=>Object.keys(CLS).map(c=>`<option>${c}</option>`).join('');
const box=(v,l)=>`<div class="card" style="flex:1;text-align:center;margin:0"><div class="big" style="font-size:26px">${v}</div><div class="mut">${l}</div></div>`;
const bar=p=>`<div style="background:var(--ac2);border-radius:6px;height:10px;margin:8px 0"><div style="width:${p}%;height:10px;border-radius:6px;background:${p>=60?'var(--ok)':p>=35?'var(--ac)':'var(--bad)'}"></div></div>`;
function init(){
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(async u=>{
    if(unsub){unsub();unsub=null}
    tests=[];mine={};att={};opened=false;loaded=false;sec=null;draft=null;isTeacher=false;myClass='';mySec='';myName='';
    if(!u){uid=null;return loginScreen()}
    uid=u.uid;
    try{
      isTeacher=(await db.collection('admins').doc(uid).get()).exists;
      if(!isTeacher&&!u.emailVerified){try{await u.reload()}catch(e){}if(!auth.currentUser.emailVerified)return verifyScreen(auth.currentUser)}
      await auth.currentUser.getIdToken(true);
      const [p,r,ar]=await Promise.all([db.collection('users').doc(uid).get(),db.collection('users/'+uid+'/results').get(),db.collection('users/'+uid+'/attempts').get().catch(()=>({docs:[]}))]);
      if(p.exists){const d=p.data();myName=d.name||'';myEmail=d.email||'';myClass=d.cls||'';mySec=d.sec||''}
      if(!isTeacher&&!mySec){return p.exists?h(logoTop()+'<div class="card"><h2>Class not set</h2><p>Please ask your teacher to set your class.</p><button class="sec" onclick="logout()">Sign out</button></div>'):classScreen()}
      r.docs.forEach(d=>mine[d.id]=d.data());ar.docs.forEach(d=>att[d.id]=d.data());
      if(!isTeacher)sec=mySec;
      const col=db.collection('tests'),q=isTeacher?col.orderBy('created','desc'):col.where('section','==',mySec).where('published','==',true);
      unsub=q.onSnapshot(s=>{tests=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);if(!timer&&!draft){if(!openHash())home()}},e=>h('<div class="card">Could not load tests.</div>'));
      loaded=true;if(!openHash())home();
    }catch(e){h('<div class="card">Something went wrong: '+esc(e.message||e)+'</div><button class="sec" onclick="logout()">Sign out</button>')}
  });
}
function loginScreen(msg){
  const up=mode==='up';
  h(logoTop()+`<div class="card"><h2>${up?'Create account':'Sign in'}</h2>
  ${up?`<input type="text" id="ln" placeholder="Full name"><select id="lc"><option value="">Select class</option>${clsOpts()}</select>`:''}
  <input type="email" id="le" placeholder="Email ID" autocapitalize="off">
  <input type="password" id="lp" placeholder="${up?'Password (letters + numbers, min 6)':'Password'}">
  <p id="lerr" style="color:var(--bad);margin:6px 0">${esc(msg||'')}</p>
  <button onclick="doAuth()">${up?'Create account':'Sign in'}</button>
  ${up?'':'<p class="mut" style="margin:12px 0 0"><a style="color:var(--ac);cursor:pointer" onclick="resetPw()">Forgot password?</a></p>'}
  <p class="mut" style="margin-top:12px">${up?'Already registered?':'New student?'} <a style="color:var(--ac);cursor:pointer" onclick="mode='${up?'in':'up'}';loginScreen()">${up?'Sign in':'Create account'}</a></p></div>`);
}
const authErr=c=>c.includes('email-already')?'This email is already registered. Please sign in.':(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))?'Wrong email or password.':c.includes('too-many')?'Too many attempts. Please try again later.':c.includes('network')?'No internet connection.':'Something went wrong. Please try again.';
async function doAuth(){
  const up=mode==='up',g=id=>document.getElementById(id),e=g('le').value.trim().toLowerCase(),p=g('lp').value,err=s=>{g('lerr').textContent=s};
  if(!/^\S+@\S+\.\S+$/.test(e))return err('Enter a valid email ID.');
  try{
    if(!up)return void await auth.signInWithEmailAndPassword(e,p);
    const n=g('ln').value.trim(),c=g('lc').value;
    if(!n)return err('Please enter your full name.');
    if(!c)return err('Please select your class.');
    if(!/^[A-Za-z0-9]{6,}$/.test(p)||!/[A-Za-z]/.test(p)||!/\d/.test(p))return err('Password: at least 6 characters, letters and numbers only, with at least one letter and one number.');
    const cr=await auth.createUserWithEmailAndPassword(e,p);
    await db.collection('users').doc(cr.user.uid).set({name:n,cls:c,sec:CLS[c],email:e,created:Date.now()});
    await cr.user.sendEmailVerification();
  }catch(x){err(authErr(x.code||''))}
}
const PWRULE='Password: at least 6 characters, letters and numbers only, with at least one letter and one number.';
const pwOk=p=>/^[A-Za-z0-9]{6,}$/.test(p)&&/[A-Za-z]/.test(p)&&/\d/.test(p);
async function resetPw(){
  const l=document.getElementById('lerr'),e=document.getElementById('le').value.trim().toLowerCase();
  const say=(s,ok)=>{l.style.color=ok?'var(--ok)':'var(--bad)';l.textContent=s};
  if(!/^\S+@\S+\.\S+$/.test(e))return say('Type your email ID in the box above first, then tap Forgot password.');
  if(/@wave-academy\.app$/.test(e))return say('This is an old account without a real email, so a reset link cannot be sent. Please ask your teacher, or create a new account with your email.');
  try{await auth.sendPasswordResetEmail(e);say('If this email is registered, a password reset link has been sent to it. Open the email (check Spam too), set a new password, then sign in here.',true)}
  catch(x){const k=x.code||'';say(k.includes('too-many')?'Too many requests. Please wait a few minutes and try again.':k.includes('network')?'No internet connection.':'Could not send the reset email. Check the email ID and try again.')}
}
function pwScreen(){
  h(`<h1>Change password</h1><div class="card"><input type="password" id="cp0" placeholder="Current password"><input type="password" id="cp1" placeholder="New password (letters + numbers, min 6)"><input type="password" id="cp2" placeholder="Confirm new password"><p id="cpm" style="margin:6px 0"></p><div class="row"><button onclick="doChangePw()">Update password</button><button class="sec" onclick="home()">Back</button></div></div>`);
}
async function doChangePw(){
  const g=id=>document.getElementById(id).value,m=(s,ok)=>{const e=document.getElementById('cpm');e.style.color=ok?'var(--ok)':'var(--bad)';e.textContent=s};
  const o=g('cp0'),n=g('cp1'),c=g('cp2'),u=auth.currentUser;
  if(!o)return m('Enter your current password.');
  if(!pwOk(n))return m('New '+PWRULE.charAt(0).toLowerCase()+PWRULE.slice(1));
  if(n!==c)return m('The new passwords do not match.');
  if(n===o)return m('The new password must be different from the current one.');
  try{
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o));
    await u.updatePassword(n);
    document.getElementById('cp0').value=document.getElementById('cp1').value=document.getElementById('cp2').value='';
    m('Password changed. Use the new password next time you sign in.',true);
  }catch(e){const k=e.code||'';m(k.includes('wrong-password')||k.includes('invalid-credential')?'Your current password is wrong.':k.includes('too-many')?'Too many attempts. Please try again later.':k.includes('requires-recent')?'Please sign out, sign in again and retry.':'Could not change the password. Please try again.')}
}
async function sendReset(email){
  const e=document.getElementById('rsm');
  if(!email||/@wave-academy\.app$/.test(email)){e.style.color='var(--bad)';e.textContent='This student has no real email address, so a reset link cannot be sent.';return}
  try{await auth.sendPasswordResetEmail(email);e.style.color='var(--ok)';e.textContent='Reset link sent to '+email+'.'}catch(x){e.style.color='var(--bad)';e.textContent='Could not send the email. Please try again later.'}
}
function verifyScreen(u,msg){
  h(logoTop()+`<div class="card"><h2>Verify your email</h2><p>We sent a verification link to <b>${esc(u.email)}</b>. Open the email, tap the link, then come back here and tap the button below.</p><p class="mut">Check your Spam folder too.</p><p id="lerr" style="color:var(--ok)">${esc(msg||'')}</p><div class="row"><button onclick="checkVerified()">I’ve verified</button><button class="sec" onclick="resendVerify()">Resend email</button><button class="sec" onclick="logout()">Sign out</button></div></div>`);
}
async function checkVerified(){const u=auth.currentUser;await u.reload();if(u.emailVerified){await u.getIdToken(true);location.reload()}else verifyScreen(u,'Not verified yet. Open the link in the email first.')}
async function resendVerify(){const u=auth.currentUser;try{await u.sendEmailVerification();verifyScreen(u,'Email sent again.')}catch(e){verifyScreen(u,'Please wait a minute before trying again.')}}
function classScreen(){h(logoTop()+`<div class="card"><h2>Choose your class</h2><select id="lc"><option value="">Select class</option>${clsOpts()}</select><br><br><button onclick="saveClass()">Continue</button></div>`)}
async function saveClass(){const c=document.getElementById('lc').value;if(!c)return;const e=auth.currentUser.email;try{await db.collection('users').doc(uid).set({name:e,cls:c,sec:CLS[c],email:e,created:Date.now()});location.reload()}catch(x){alert('Could not save: '+(x.message||x))}}
function logout(){auth.signOut()}

const SECS=['Class IX','Class X','Physics XI','Physics XII'];
const BASE=location.href.split('#')[0];
function openHash(){
  if(opened||!loaded)return false;
  const id=location.hash.slice(1),t=tests.find(x=>x.id===id);
  if(!t)return false;
  opened=true;sec=t.section||'Other';
  if(mine[id])return false;
  if(over(t)&&!att[id]){timeOver();return true}
  start(id);return true;
}

function ytId(u){
  u=(u||'').trim();let m='';
  if(/^[\w-]{11}$/.test(u))return u;
  try{
    const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u),hn=x.hostname.replace(/^(www|m|music)\./,'');
    if(hn==='youtu.be')m=x.pathname.slice(1).split('/')[0];
    else if(hn==='youtube.com'||hn==='youtube-nocookie.com'){
      if(x.pathname==='/watch')m=x.searchParams.get('v')||'';
      else{const p=x.pathname.split('/');if(['embed','shorts','live','v'].includes(p[1]))m=p[2]||''}
    }
  }catch(e){}
  return /^[\w-]{11}$/.test(m||'')?m:'';
}

function htmlToLines(html){
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),lines=[];
  const txt=n=>{
    if(n.nodeType===3)return n.nodeValue;
    if(n.nodeType!==1)return '';
    const g=n.tagName;
    if(g==='IMG')return '';
    if(g==='BR')return ' ';
    const s=Array.from(n.childNodes).map(txt).join('');
    if(g==='SUP')return s.trim()?'$^{'+s.trim()+'}$':'';
    if(g==='SUB')return s.trim()?'$_{'+s.trim()+'}$':'';
    return s;
  };
  const lineOf=(nodes,li)=>{
    const t=nodes.map(txt).join('').replace(/[ \t\r\n ]+/g,' ').trim(),im=[];
    nodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='IMG'){im.push(n.getAttribute('src')||'')}else n.querySelectorAll('img').forEach(i=>im.push(i.getAttribute('src')||''))});
    const ims=im.filter(Boolean);
    if(t||ims.length)lines.push({t,im:ims,li});
  };
  const walk=(p,li)=>{
    Array.from(p.childNodes).forEach(c=>{
      if(c.nodeType!==1)return;
      const g=c.tagName;
      if(g==='UL'||g==='OL')return walk(c,true);
      if(g==='LI'){
        const inl=[],lst=[];
        Array.from(c.childNodes).forEach(x=>{if(x.nodeType===1&&(x.tagName==='UL'||x.tagName==='OL'))lst.push(x);else inl.push(x)});
        const hasBlk=inl.some(x=>x.nodeType===1&&/^(P|DIV|TABLE)$/.test(x.tagName));
        if(hasBlk){const w=doc.createElement('div');inl.forEach(x=>w.appendChild(x.cloneNode(true)));walk(w,true)}else lineOf(inl,true);
        lst.forEach(l=>walk(l,true));
        return;
      }
      if(c.querySelector('p,ul,ol,li,table,div'))return walk(c,li);
      lineOf([c],li);
    });
  };
  walk(doc.body,false);
  return lines;
}
function parseLines(L){

  const kind=s=>!s?'':ANS.test(s)?'a':QRE.test(s)?'q':(OPT.test(s)||OPTN.test(s))?'o':'';
  const hasQ=L.some(l=>kind(l.t)==='q'),hasO=L.some(l=>kind(l.t)==='o');
  const out=[];let cur=null;
  const newQ=t=>{cur={q:t,qi:'',o:[],oi:[],a:-1,closed:false,extra:false};out.push(cur)};
  const addOpt=t=>{if(cur.o.length<4)cur.o.push(t);else cur.extra=true};
  const attach=im=>{
    if(!cur||cur.closed||!im.length)return;
    if(cur.o.length===0){if(!cur.qi)cur.qi=im[0]}else{const j=cur.o.length-1;if(j<4&&!cur.oi[j])cur.oi[j]=im[0]}
  };
  const cont=t=>{if(cur.o.length===0)cur.q+=(cur.q?'\n':'')+t;else{const j=Math.min(cur.o.length,4)-1;cur.o[j]+=' '+t}};

    }

    if(cur.closed){if(!hasQ){newQ(t);attach(l.im)}continue}
    if(!hasQ&&!hasO){if(cur.o.length<4)addOpt(t);else newQ(t)}
    else if(hasQ&&!hasO){if(cur.o.length<4)addOpt(t);else cont(t)}

  return qs;
}

let cur=null,att={},pend=null;
const nr=x=>{const t=tests.find(z=>z.id===x.testId);if(!t||x.mk||!hasNeg(t)||!x.answers)return x;const n=t.questions.length;let c=0,w=0;x.answers.forEach((a,i)=>{if(a>=0&&t.questions[i]){if(a===t.questions[i].answer)c++;else w++}});return {...x,score:4*c-w,total:4*n,mk:1}};
const normMine=()=>{Object.keys(mine).forEach(k=>mine[k]=nr(mine[k]))};
const hasNeg=t=>t.section==='Physics XI'||t.section==='Physics XII';
const brk=(t,rec)=>{if(!rec.mk)return '';const an=rec.answers||[];let c=0,w=0,s=0;t.questions.forEach((q,i)=>{const a=an[i];if(a==null||a<0)s++;else if(a===q.answer)c++;else w++});return `<div class="card mut" style="text-align:center">${c} correct × (+4) = <b>+${4*c}</b><br>${w} wrong × (−1) = <b>−${w}</b><br>${s} unattempted × 0 = <b>0</b></div>`};
const clk=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),hr=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (hr?hr+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
const durMin=t=>t.mins||Math.max(1,Math.round((t.secs||30)*t.questions.length/60));
function start(id){
  const t=tests.find(x=>x.id===id);if(!t)return;if(mine[id])return home();
  const a=att[id];if(over(t)&&!a)return timeOver();
  h(`<h1>${esc(t.title)}</h1><div class="card"><p>${t.questions.length} questions · <b>${durMin(t)} minutes</b> in total.</p><ul style="padding-left:18px;line-height:1.7">${hasNeg(t)?'<li><b>Marking: +4 for each correct answer, −1 for each wrong answer, 0 for unattempted questions.</b> Total marks: '+4*t.questions.length+'.</li>':''}<li>You can skip a question and come back to it later.</li><li>Correct answers are shown only after you submit.</li><li>If the app closes or the phone switches off, your timer stops and continues from the same point when you open the test again.</li></ul>${a?`<p><b>You have ${clk(a.remaining)} left.</b></p>`:''}<button onclick="begin('${id}')">${a?'Resume test':'Begin'}</button> <button class="sec" onclick="home()">Back</button></div>`);
}
function begin(id){
  const t=tests.find(x=>x.id===id);if(!t)return;
  const a=att[id],n=t.questions.length;if(over(t)&&!a)return timeOver();
  cur={t,screen:'q',i:a?Math.min(a.idx||0,n-1):0,ans:a&&a.answers&&a.answers.length===n?a.answers.slice():new Array(n).fill(-1),times:a&&a.times&&a.times.length===n?a.times.slice():new Array(n).fill(0),rem:a?a.remaining:durMin(t)*60000,last:Date.now(),saved:0};
  document.addEventListener('visibilitychange',onVis);window.addEventListener('pagehide',onHide);
  drawTest();clearInterval(timer);timer=setInterval(tick,1000);saveAttempt();
}
function saveAttempt(){
  if(!cur)return;cur.saved=Date.now();
  const rec={answers:cur.ans,times:cur.times.map(v=>Math.round(v)),idx:cur.i,remaining:Math.max(0,Math.round(cur.rem)),updated:Date.now()};
  att[cur.t.id]=rec;
  try{db.collection('users/'+uid+'/attempts').doc(cur.t.id).set(rec).catch(()=>{})}catch(e){}
}
function onVis(){if(!cur)return;if(document.visibilityState==='hidden')saveAttempt();else cur.last=Date.now()}
function onHide(){if(cur)saveAttempt()}
function tick(){
  if(!cur)return;
  const now=Date.now();
  if(document.visibilityState==='visible'){const dt=Math.min(Math.max(now-cur.last,0),3000);cur.rem-=dt;if(cur.screen==='q')cur.times[cur.i]+=dt}
  cur.last=now;
  const el=document.getElementById('tm');
  if(el){el.textContent='⏱ '+clk(cur.rem)+' left';el.style.color=cur.rem<=60000?'var(--bad)':''}
  if(cur.rem<=0)return submit(true);
  if(now-cur.saved>30000)saveAttempt();
}
function drawTest(){
  if(cur.screen==='c')return drawConfirm();
  const {t,ans,i}=cur,q=t.questions[i],n=t.questions.length,last=i===n-1;
  const nav=t.questions.map((_,k)=>`<button id="nv${k}" class="nv ${k===i?'cu':''} ${ans[k]>=0?'dn':''}" onclick="goQ(${k})">${k+1}</button>`).join('');
  let o=`<div class="timer" id="tm"></div><div class="row sp" style="margin:8px 0"><b>${esc(t.title)}</b><span class="mut" id="cnt">${ans.filter(a=>a>=0).length}/${n} answered</span></div><div class="nvbar">${nav}</div><div class="mut" style="margin:8px 0 4px;font-size:13px">Filled = answered · Tap any number to jump to that question</div><div class="mut" style="margin:6px 0 4px">Question ${i+1} of ${n}</div><div class="card"><b>${fmt(q.q)}</b>${imgQ(q)}`;
  q.options.forEach((op,j)=>o+=`<div class="opt ${ans[i]===j?'sel':''}" id="op${j}" onclick="pick(${j})">${optHtml(q,j)}</div>`);
  o+=`<button class="del" id="clr" style="${ans[i]>=0?'':'display:none'}" onclick="pick(-1)">Clear my answer</button></div>`;
  o+=`<div class="row" style="margin-top:6px"><button class="sec" onclick="goQ(${i-1})" ${i===0?'disabled':''}>← Previous</button>${last?'':`<button id="nx" onclick="goQ(${i+1})">${ans[i]>=0?'Next →':'Skip →'}</button>`}<button class="sec" style="margin-left:auto" onclick="askSubmit()">Finish &amp; submit</button></div>`;
  h(o);tick();
}
function goQ(k){if(!cur||k<0||k>=cur.t.questions.length)return;cur.i=k;cur.screen='q';drawTest();saveAttempt()}
function pick(j){
  const i=cur.i,q=cur.t.questions[i];cur.ans[i]=j;
  q.options.forEach((_,k)=>{const e=document.getElementById('op'+k);if(e)e.classList.toggle('sel',k===j)});
  const nv=document.getElementById('nv'+i);if(nv)nv.classList.toggle('dn',j>=0);
  const c=document.getElementById('cnt');if(c)c.textContent=cur.ans.filter(a=>a>=0).length+'/'+cur.ans.length+' answered';
  const cl=document.getElementById('clr');if(cl)cl.style.display=j>=0?'':'none';
  const nx=document.getElementById('nx');if(nx)nx.textContent=j>=0?'Next →':'Skip →';
  saveAttempt();
}
function askSubmit(){cur.screen='c';drawConfirm()}
function drawConfirm(){
  const {t,ans}=cur,n=t.questions.length,un=[];ans.forEach((a,k)=>{if(a<0)un.push(k)});
  h(`<div class="timer" id="tm"></div><h1>Submit test?</h1><div class="card"><p>You have answered <b>${n-un.length}</b> of <b>${n}</b> questions.</p>${un.length?`<p>Not answered:</p><div class="nvbar">${un.map(k=>`<button class="nv" onclick="goQ(${k})">${k+1}</button>`).join('')}</div><p class="mut">Tap a number to go back to that question.</p>`:''}<p class="mut">After you submit, you can’t change your answers or take this test again.</p><div class="row"><button onclick="submit(false)">Yes, submit</button><button class="sec" onclick="goQ(${cur.i})">Go back</button></div></div>`);
  tick();
}
async function saveRec(rec){
  await db.collection('results').doc(rec.testId+'_'+uid).set(rec);
  await db.collection('users/'+uid+'/results').doc(rec.testId).set(rec);
  try{await db.collection('users/'+uid+'/attempts').doc(rec.testId).delete()}catch(e){}
  delete att[rec.testId];mine[rec.testId]=rec;
}
async function submit(auto){
  if(!cur)return;
  clearInterval(timer);timer=null;
  document.removeEventListener('visibilitychange',onVis);window.removeEventListener('pagehide',onHide);
  const {t,ans}=cur,times=cur.times.map(v=>Math.round(v/1000));cur=null;
  const mk=hasNeg(t),nq=t.questions.length,cc=ans.reduce((n,a,i)=>n+(a===t.questions[i].answer?1:0),0),ww=ans.reduce((n,a,i)=>n+(a>=0&&a!==t.questions[i].answer?1:0),0);
  const total=mk?4*nq:nq,score=mk?4*cc-ww:cc;
  pend={rec:{testId:t.id,uid,name:myName,email:myEmail,score,total,answers:ans,times,at:Date.now(),...(mk?{mk:1}:{})},auto};
  await finishSave();
}
async function finishSave(){
  const {rec,auto}=pend;
  h('<p class="mut">Saving your answers…</p>');
  try{await saveRec(rec)}
  catch(e){return h('<div class="card"><h2>Could not save your answers</h2><p>Please check your internet connection and try again. Do not close this page.</p><button onclick="finishSave()">Try again</button></div>')}
  pend=null;showResult(rec.testId,auto);
}
function showResult(id,auto){normMine();
  const t=tests.find(x=>x.id===id),rec=mine[id];if(!t||!rec)return home();
  const ans=rec.answers||[],times=rec.times||[];
  let o=`<h1>${auto?'Time’s up!':'Submitted!'}</h1><div class="card" style="text-align:center"><div class="mut">Your score</div><div class="big">${rec.score}/${rec.total}</div><div class="mut">${Math.round(rec.score/rec.total*100)}%</div></div>${brk(t,rec)}<h2>Review</h2>`;
  t.questions.forEach((q,i)=>{
    o+=`<div class="card"><b>${i+1}. ${fmt(q.q)}</b>${tmBadge(times,i)}${imgQ(q)}`;
    q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===ans[i]?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓':''}${j===ans[i]&&j!==q.answer?' ✗':''}</div>`);
    o+=`</div>`;
  });
  h(o+`<button onclick="home()">Back to tests</button>`);
}
let myMobile='';
const menuExtra=()=>`<div class="row" style="margin-top:6px"><button class="sec" onclick="progress()">📊 My progress</button>${isTeacher?'<button class="sec" onclick="students()">👥 Students</button>':''}</div>`;
let rcache=null,rfil='all';
async function results(id){
  const t=tests.find(x=>x.id===id);if(!t)return home();
  h('<p class="mut">Loading students…</p>');
  try{
    const [u,r]=await Promise.all([db.collection('users').where('sec','==',t.section).get(),db.collection('results').where('testId','==',id).get()]);
    const sub={};r.docs.forEach(d=>{const x=d.data();sub[x.uid]=nr(x)});
    const rows=u.docs.filter(d=>d.id!==uid).map(d=>({uid:d.id,name:d.data().name,mobile:d.data().email,res:sub[d.id]||null}));
    Object.keys(sub).forEach(k=>{if(k!==uid&&!rows.some(x=>x.uid===k))rows.push({uid:k,name:sub[k].name,mobile:sub[k].email||'',res:sub[k]})});
    rcache={t,rows};drawResults();
  }catch(e){h('<div class="card">Could not load students: '+esc(e.message||e)+'. Make sure you published the latest Firebase rules.</div><button onclick="home()">Back</button>')}
}

function paperPdf(id,key){
  const t=tests.find(x=>x.id===id);if(!t)return;
  const n=t.questions.length,neg=hasNeg(t),L='ABCD';
  let o=`<h1>THE WAVE ACADEMY</h1><div class="pc">${esc(t.section||'')}</div><div class="pc"><b>${esc(t.title)}</b></div><div class="pc">Time: ${durMin(t)} minutes &nbsp;·&nbsp; Questions: ${n} &nbsp;·&nbsp; Maximum marks: ${neg?4*n:n}</div>${neg?'<div class="pc"><i>Marking: +4 for each correct answer, −1 for each wrong answer, 0 for unattempted.</i></div>':''}<hr>`;
  t.questions.forEach((q,i)=>{
    o+=`<div class="pq"><div><b>${i+1}.</b> ${fmt(q.q)}</div>${imgQ(q)}`;
    q.options.forEach((op,j)=>o+=`<div class="pop">(${L[j]}) ${optHtml(q,j)}</div>`);
    o+='</div>';
  });
  if(key){
    o+=`<div class="pk"><h1>Answer Key</h1><div class="pc">${esc(t.title)}</div><hr><table><tr>${t.questions.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr><tr>${t.questions.map(q=>`<td style="text-align:center">${L[q.answer]||'–'}</td>`).join('')}</tr></table></div>`;
  }
  document.getElementById('pp').innerHTML=o;
  const old=document.title;document.title=(t.title||'Question paper')+(key?' - with answer key':' - Question paper');
  const done=()=>{document.title=old;document.getElementById('pp').innerHTML='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),300);
}
function drawResults(){
  const t=rcache.t,rows=rcache.rows,done=rows.filter(x=>x.res),no=rows.filter(x=>!x.res);
  done.sort((a,b)=>b.res.score-a.res.score||(a.name||'').localeCompare(b.name||''));
  no.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const avg=done.length?(done.reduce((s,x)=>s+x.res.score,0)/done.length).toFixed(1):'–';
  let o=`<button class="sec" onclick="home()">← Back</button><h1 style="margin-top:12px">${esc(t.title)}</h1><p class="mut">${esc(t.section||'')} · ${t.questions.length} questions · ${durMin(t)} min</p>
  <div class="row" style="margin:8px 0"><button class="sec" onclick="paperPdf('${t.id}',false)">📄 Question paper PDF</button><button class="sec" onclick="paperPdf('${t.id}',true)">📄 PDF with answer key</button></div><div class="row" style="gap:10px;flex-wrap:nowrap">${box(done.length,'Attempted')}${box(no.length,'Not attempted')}${box(avg,'Average score')}</div>
  <p class="mut" style="margin:14px 0 4px"><span style="color:#1f9d55">●</span> Green = attempted (tap for test analysis) &nbsp; <span style="color:#d64545">●</span> Red = not attempted</p><div>`;
  done.forEach(x=>o+=`<button class="pill ok" onclick="analysis('${x.uid}')">${esc(x.name)} · ${x.res.score}/${x.res.total}</button>`);
  no.forEach(x=>o+=`<button class="pill no" onclick="notTaken('${x.uid}')">${esc(x.name)}</button>`);
  if(!rows.length)o+='<div class="card mut">No students have joined this class yet.</div>';
  h(o+`</div><div id="nt"></div>`);
}
function notTaken(u){
  const x=rcache.rows.find(r=>r.uid===u),e=document.getElementById('nt');if(!x||!e)return;
  e.innerHTML=`<div class="card" style="border-color:#d64545"><b>${esc(x.name)}</b><div class="mut">${esc(x.mobile||'')}</div><p style="margin:6px 0 0;color:#d64545">Has not attempted this test yet.</p></div>`;
  e.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function analysis(u){
  const t=rcache.t,x=rcache.rows.find(r=>r.uid===u);if(!x||!x.res)return;
  const res=x.res,n=t.questions.length,an=res.answers||[],tm=res.times||[];
  let cor=0,wr=0,sk=0;t.questions.forEach((q,i)=>{const a=an[i];if(a==null||a<0)sk++;else if(a===q.answer)cor++;else wr++});
  const done=rcache.rows.filter(r=>r.res),rank=1+done.filter(r=>r.res.score>res.score).length;
  const avg=(done.reduce((s,r)=>s+r.res.score,0)/done.length).toFixed(1),tot=tm.reduce((a,b)=>a+(b||0),0);
  const slow=tm.map((v,i)=>({v:v||0,i})).sort((a,b)=>b.v-a.v).slice(0,3).filter(z=>z.v>0);
  let o=`<button class="sec" onclick="drawResults()">← All students</button><h1 style="margin-top:12px">${esc(x.name)}</h1><p class="mut">${esc(x.mobile||'')} · ${esc(t.title)}</p>
  <div class="row" style="gap:10px;flex-wrap:nowrap">${box(res.score+'/'+res.total,'Score')}${box(Math.round(res.score/res.total*100)+'%','Percentage')}${box('#'+rank+' / '+done.length,'Rank')}</div>
  <div class="row" style="gap:10px;flex-wrap:nowrap;margin-top:10px">${box(cor,'Correct')}${box(wr,'Wrong')}${box(sk,'Skipped')}</div>${brk(rcache.t,res)}
  <div class="card"><div>⏱ Total time: <b>${tm.length?ft(tot):'not recorded'}</b>${tm.length?' · average '+ft(tot/n)+' per question':''}</div>${slow.length?`<div class="mut" style="margin-top:4px">Took the longest on: ${slow.map(z=>'Q'+(z.i+1)+' ('+ft(z.v)+')').join(', ')}</div>`:''}<div class="mut" style="margin-top:4px">Class average: ${avg}/${n} · Submitted ${new Date(res.at).toLocaleString()}</div></div><h2>Question-wise analysis</h2>`;
  t.questions.forEach((q,i)=>{
    const a=an[i],s=a==null||a<0,ok=a===q.answer;
    o+=`<div class="card"><div class="row sp"><b style="color:${s?'var(--mut)':ok?'var(--ok)':'var(--bad)'}">${s?'– Skipped':ok?'✓ Correct':'✗ Wrong'}</b>${tm.length?`<span class="mut">⏱ ${ft(tm[i]||0)}</span>`:''}</div><div style="margin:6px 0"><b>${i+1}. ${fmt(q.q)}</b></div>${imgQ(q)}`;
    q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===a?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓ correct answer':''}${j===a&&j!==q.answer?' ✗ student’s answer':''}${j===a&&j===q.answer?' (student’s answer)':''}</div>`);
    o+=`</div>`;
  });
  h(o+`<button onclick="drawResults()">Back to students</button>`);
}
async function togglePub(id,v){
  try{await db.collection('tests').doc(id).update({published:v})}catch(e){alert('Could not change: '+(e.message||e))}
}
function progress(){normMine();
  const items=Object.keys(mine).map(k=>({id:k,...mine[k]})).sort((a,b)=>b.at-a.at);
  if(!items.length)return h('<h1>My progress</h1><div class="card mut">You haven’t taken any tests yet.</div><button onclick="home()">Back</button>');
  const pct=x=>Math.round(x.score/x.total*100),avg=Math.round(items.reduce((s,x)=>s+pct(x),0)/items.length),best=Math.max(...items.map(pct));
  const box=(v,l)=>`<div class="card" style="flex:1;text-align:center;margin:0"><div class="big" style="font-size:26px">${v}</div><div class="mut">${l}</div></div>`;
  let o=`<h1>My progress</h1><p class="mut">${esc(myName)}</p><div class="row" style="gap:10px;flex-wrap:nowrap">${box(items.length,'Tests taken')}${box(avg+'%','Average')}${box(best+'%','Best')}</div>`;
  items.forEach(x=>{const t=tests.find(y=>y.id===x.id),p=pct(x);
    o+=`<div class="card"><div class="row sp"><b>${esc(t?t.title:'(deleted test)')}</b><span>${x.score}/${x.total}</span></div><div class="mut">${t?esc(t.section||'Other')+' · ':''}${new Date(x.at).toLocaleDateString()}${x.times?' · ⏱ '+ft(x.times.reduce((a,b)=>a+(b||0),0)):''}</div><div style="background:var(--ac2);border-radius:6px;height:10px;margin:8px 0"><div style="width:${p}%;height:10px;border-radius:6px;background:${p>=60?'var(--ok)':p>=35?'var(--ac)':'var(--bad)'}"></div></div><div class="row sp"><span class="mut">${p}%</span>${t?`<button class="sec" onclick="showReview('${x.id}','p')">Review answers</button>`:''}</div></div>`});
  h(o+`<button onclick="home()">Back</button>`);
}
const ft=s=>{s=Math.round(s||0);return s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s'};
const tmBadge=(a,i)=>a&&a[i]!=null?`<span class="mut" style="float:right">⏱ ${ft(a[i])}</span>`:'';
function timeChips(t,x){
  if(!x.times)return '<div class="mut">Time not recorded</div>';
  const tot=x.times.reduce((a,b)=>a+(b||0),0),an=x.answers||[];
  return `<div class="mut" style="margin-bottom:6px">⏱ Total time: <b>${ft(tot)}</b></div><div class="row" style="gap:6px">${t.questions.map((q,i)=>{const sk=an[i]<0,ok=an[i]===q.answer;return `<span style="padding:3px 8px;border-radius:8px;background:var(--ac2);font-size:13px">Q${i+1} <span style="color:var(--${sk?'mut':ok?'ok':'bad'})">${sk?'–':ok?'✓':'✗'}</span> ${ft(x.times[i]||0)}</span>`}).join('')}</div>`;
}
function showReview(id,from){normMine();
  const t=tests.find(x=>x.id===id),rec=mine[id];if(!t||!rec)return;
  const ans=rec.answers||[],times=rec.times||[];
  let o=`<h1>${esc(t.title)}</h1><div class="card" style="text-align:center"><div class="big">${rec.score}/${rec.total}</div></div>${brk(t,rec)}`;
  t.questions.forEach((q,i)=>{o+=`<div class="card"><b>${i+1}. ${fmt(q.q)}</b>${tmBadge(times,i)}${imgQ(q)}`;q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===ans[i]?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓':''}${j===ans[i]&&j!==q.answer?' ✗':''}</div>`);o+='</div>'});
  h(o+`<button onclick="${from==='p'?'progress()':'home()'}">Back</button>`);
}
init();
</script>
