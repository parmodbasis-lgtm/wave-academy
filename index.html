function idolOff(){const b=document.getElementById('ib');if(b){b.classList.remove('on');b.dataset.i=''}document.querySelectorAll('.ic.sel').forEach(x=>x.classList.remove('sel'))}
function idol(i,el){
  const b=document.getElementById('ib');if(!b)return;
  if(b.classList.contains('on')&&b.dataset.i===String(i))return idolOff();
  idolOff();el.classList.add('sel');
  const d=IDDESC[PHYS[i][0]]||[PHYS[i][0],''];
  b.innerHTML='<b>'+esc(d[0])+'</b>'+esc(d[1]).replace(/(\d+)(st|nd|rd|th)\b/g,'$1<sup>$2</sup>')+'<span class="tl"></span>';b.dataset.i=i;b.classList.add('on');
  const P=b.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect(),w=Math.min(P.width-16,270),cx=r.left+r.width/2-P.left;
  b.style.width=w+'px';const left=Math.max(8,Math.min(cx-w/2,P.width-w-8));b.style.left=left+'px';
  b.querySelector('.tl').style.left=(cx-left-7)+'px';b.style.bottom=(P.bottom-r.top+10)+'px';
}

function ytId(u){
  u=(u||'').trim();let m='';
  if(/^[\w-]{11}$/.test(u))return u;
  try{
    const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u),hn=x.hostname.replace(/^(www|m|music)\./,'');
    if(hn==='youtu.be')m=x.pathname.slice(1).split('/')[0];
    else if(hn==='youtube.com'||hn==='youtube-nocookie.com'){
      if(x.pathname==='/watch')m=x.searchParams.get('v')||'';
      else{const p=x.pathname.split('/');if(['embed','shorts','live','v'].includes(p[1]))m=p[2]||''}
    }
  }catch(e){}
  return /^[\w-]{11}$/.test(m||'')?m:'';
}

async function editLec(lid){
  lc.edit=lid;lc.pre=null;const l=lc.lecs.find(x=>x.id===lid);let url='';
  try{const d=await db.collection('lectureSrc').doc(lid).get();if(d.exists)url='https://youtu.be/'+d.data().vid}catch(e){}
  lc.pre={title:l.title,url};lecAdminIn(lc.o);
}
async function saveLec(){
  const g=id=>document.getElementById(id).value,err=s=>{document.getElementById('lme').textContent=s};
  const title=g('lt').trim(),raw=g('lu').trim(),lid=lc.edit;
  if(!title)return err('Please enter the topic name.');
  let vid='';
  if(raw){vid=ytId(raw);if(!vid)return err('This does not look like a valid YouTube link.')}
  else if(!lid)return err('Please paste the YouTube link.');
  try{
    if(lid){
      if(vid)await db.collection('lectureSrc').doc(lid).set({section:sec,vid});
      await db.collection('lectures').doc(lid).update({title});
    }else{
      const id=nid(),ord=Math.max(0,...lc.lecs.map(l=>l.order||0))+1;
      await db.collection('lectureSrc').doc(id).set({section:sec,vid});
      await db.collection('lectures').doc(id).set({section:sec,chapterId:'',topicId:'',title,order:ord,free:false,published:true,created:Date.now()});
    }
    lc.edit=null;lc.pre=null;lecAdminIn(lc.o);
  }catch(e){err('Could not save: '+(e.message||e))}
}
async function lecSet(lid,v){try{await db.collection('lectures').doc(lid).update(v);lecAdminIn(lc.o)}catch(e){alert('Could not change: '+(e.message||e))}}
async function moveLec(lid,dir){
  const a=lc.lecs.slice(),i=a.findIndex(l=>l.id===lid),j=i+dir;if(i<0||j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];

function aiAdd(txt,topic){

}

/* ===== Word equations (OMML) -> LaTeX, so equations come in exactly as typed ===== */
const OM_NS='http://schemas.openxmlformats.org/officeDocument/2006/math',W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const OM_SYM={'α':'\\alpha ','β':'\\beta ','γ':'\\gamma ','δ':'\\delta ','ε':'\\varepsilon ','ϵ':'\\epsilon ','ζ':'\\zeta ','η':'\\eta ','θ':'\\theta ','ϑ':'\\vartheta ','ι':'\\iota ','κ':'\\kappa ','λ':'\\lambda ','μ':'\\mu ','ν':'\\nu ','ξ':'\\xi ','π':'\\pi ','ρ':'\\rho ','σ':'\\sigma ','ς':'\\varsigma ','τ':'\\tau ','υ':'\\upsilon ','φ':'\\varphi ','ϕ':'\\phi ','χ':'\\chi ','ψ':'\\psi ','ω':'\\omega ','Γ':'\\Gamma ','Δ':'\\Delta ','Θ':'\\Theta ','Λ':'\\Lambda ','Ξ':'\\Xi ','Π':'\\Pi ','Σ':'\\Sigma ','Φ':'\\Phi ','Ψ':'\\Psi ','Ω':'\\Omega ','∂':'\\partial ','∇':'\\nabla ','∞':'\\infty ','±':'\\pm ','∓':'\\mp ','×':'\\times ','÷':'\\div ','·':'\\cdot ','⋅':'\\cdot ','∘':'\\circ ','≤':'\\le ','≥':'\\ge ','≠':'\\ne ','≈':'\\approx ','≡':'\\equiv ','∝':'\\propto ','∼':'\\sim ','≪':'\\ll ','≫':'\\gg ','→':'\\to ','←':'\\leftarrow ','↔':'\\leftrightarrow ','⇒':'\\Rightarrow ','⇔':'\\Leftrightarrow ','⟹':'\\Longrightarrow ','↑':'\\uparrow ','↓':'\\downarrow ','∈':'\\in ','∉':'\\notin ','⊂':'\\subset ','⊃':'\\supset ','∪':'\\cup ','∩':'\\cap ','∀':'\\forall ','∃':'\\exists ','∅':'\\emptyset ','√':'\\surd ','∑':'\\sum ','∏':'\\prod ','∫':'\\int ','°':'^{\\circ}','′':"'",'″':"''",'ℏ':'\\hbar ','ħ':'\\hbar ','ℓ':'\\ell ','Å':'\\text{Å}','…':'\\ldots ','⋯':'\\cdots ','⋮':'\\vdots ','∠':'\\angle ','⊥':'\\perp ','∥':'\\parallel ','−':'-','–':'-','‐':'-','∗':'*','⁄':'/','\u00a0':' ','\u2009':' ','\u200a':' ','\u2061':'','\u2062':'','\u2063':'','\u2064':'','ℝ':'\\mathbb{R}','ℂ':'\\mathbb{C}','ℕ':'\\mathbb{N}','ℤ':'\\mathbb{Z}','ℚ':'\\mathbb{Q}','⃗':'','⟨':'\\langle ','⟩':'\\rangle ','⌊':'\\lfloor ','⌋':'\\rfloor ','⌈':'\\lceil ','⌉':'\\rceil ','‖':'\\| ','∣':'|','⊕':'\\oplus ','⊗':'\\otimes ','∴':'\\therefore ','∵':'\\because ','‰':'\\permil '};
function omText(s){
  let o='';
  for(const c of s){
    if(OM_SYM[c]!==undefined)o+=OM_SYM[c];
    else if(c==='{'||c==='}')o+='\\'+c;
    else if(c==='\\')o+='\\backslash ';
    else if(c==='#'||c==='%'||c==='$')o+='\\'+c;
    else if(c==='_')o+='\\_';
    else if(c==='~')o+='\\sim ';
    else if(c===' '||c==='\t'||c==='\n')o+='';

  }

}
const OM_FN=new Set(['sin','cos','tan','cot','sec','csc','arcsin','arccos','arctan','sinh','cosh','tanh','coth','log','ln','lg','exp','lim','max','min','sup','inf','det','dim','gcd','deg','arg','ker','hom','Pr','mod']);
const OM_ACC={'\u0302':'hat','^':'hat','\u0303':'tilde','~':'tilde','\u0304':'bar','\u00af':'bar','\u0305':'overline','\u0307':'dot','\u0308':'ddot','\u20d7':'vec','\u2192':'vec','\u20d6':'overleftarrow','\u030c':'check','\u0301':'acute','\u0300':'grave','\u0306':'breve'};

function omToLatex(root){
  const kids=n=>Array.from(n.childNodes).filter(c=>c.nodeType===1);
  const ch=(n,name)=>kids(n).find(c=>c.localName===name);
  const val=(n,name)=>{const p=n&&kids(n).find(c=>/Pr$/.test(c.localName));const e=p&&ch(p,name);return e?(e.getAttributeNS(OM_NS,'val')??e.getAttribute('m:val')):null};

  const sub=(n,name)=>{const c=ch(n,name);return c?cv(c):''};
  const br=s=>'{'+s+'}';
  function conv(n){
    switch(n.localName){
      case 'r':{
        let t='';kids(n).forEach(c=>{if(c.localName==='t')t+=c.textContent});
        const pr=ch(n,'rPr'),nor=pr&&ch(pr,'nor'),sty=pr&&ch(pr,'sty'),s=sty&&(sty.getAttributeNS(OM_NS,'val')||sty.getAttribute('m:val'));
        if(nor&&(nor.getAttributeNS(OM_NS,'val')||nor.getAttribute('m:val')||'1')!=='0')return '\\text{'+t.replace(/[{}\\$#%&_~^]/g,'')+'}';

        if(s==='p'&&/^[A-Za-z]$/.test(t))return '\\mathrm{'+t+'}';
        if(s==='b'||s==='bi')return '\\mathbf{'+x+'}';

      case 'sSubSup':return br(sub(n,'e'))+'_'+br(sub(n,'sub'))+'^'+br(sub(n,'sup'));

        const c=val(n,'chr'),op=c===null?'\\int':(OM_NARY[c]||omText(c)),sb=sub(n,'sub'),sp=sub(n,'sup'),hs=val(n,'subHide'),hp=val(n,'supHide');

        return o+' '+br(sub(n,'e'));
      }
      case 'd':{
        const b=val(n,'begChr'),e=val(n,'endChr'),s=val(n,'sepChr');
        const L=b===null?'(':(OM_DEL[b]!==undefined?OM_DEL[b]:omText(b)),R=e===null?')':(OM_DEL[e]!==undefined?OM_DEL[e]:omText(e)),S=s===null?'|':(OM_DEL[s]!==undefined?OM_DEL[s]:omText(s));

      }
      case 'acc':{
        const c=val(n,'chr'),cmd=c===null?'hat':(OM_ACC[c]||'hat');

      }
      case 'bar':return (val(n,'pos')==='bot'?'\\underline':'\\overline')+br(sub(n,'e'));
      case 'func':{

      case 'limLow':{

      case 'eqArr':return '\\begin{aligned}'+kids(n).filter(c=>c.localName==='e').map(cv).join('\\\\ ')+'\\end{aligned}';
      case 'm':return '\\begin{matrix}'+kids(n).filter(c=>c.localName==='mr').map(r=>kids(r).filter(c=>c.localName==='e').map(cv).join(' & ')).join('\\\\ ')+'\\end{matrix}';
      case 'rPr':case 'ctrlPr':case 'fPr':case 'dPr':case 'naryPr':case 'radPr':case 'accPr':case 'funcPr':case 'barPr':case 'limLowPr':case 'limUppPr':case 'sSupPr':case 'sSubPr':case 'sSubSupPr':case 'sPrePr':case 'mPr':case 'eqArrPr':case 'groupChrPr':case 'boxPr':case 'phantPr':case 'oMathParaPr':return '';

    }
  }

/* Replace every Word equation in the .docx with its LaTeX written between $ signs, so the normal importer reads it */
async function docxPre(buf){
  if(typeof JSZip==='undefined')return {buf,n:0,bad:0};
  const z=await JSZip.loadAsync(buf),f=z.file('word/document.xml');if(!f)return {buf,n:0,bad:0};
  const xml=await f.async('string');
  if(xml.indexOf('oMath')<0)return {buf,n:0,bad:0};
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)return {buf,n:0,bad:0};
  let n=0,bad=0;
  const mk=tex=>{const r=doc.createElementNS(W_NS,'w:r'),t=doc.createElementNS(W_NS,'w:t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=tex;r.appendChild(t);return r};
  const conv=el=>{let tex='';try{tex=omToLatex(el)}catch(e){bad++}return tex};
  const paras=Array.from(doc.getElementsByTagNameNS(OM_NS,'oMathPara'));
  paras.forEach(p=>{
    const parts=Array.from(p.childNodes).filter(c=>c.nodeType===1&&c.localName==='oMath').map(conv).filter(Boolean);
    if(!parts.length){p.parentNode.removeChild(p);return}
    n+=parts.length;p.parentNode.replaceChild(mk(' $'+parts.join('$ $')+'$ '),p);
  });
  Array.from(doc.getElementsByTagNameNS(OM_NS,'oMath')).forEach(m=>{
    const tex=conv(m);if(!tex){m.parentNode.removeChild(m);return}
    n++;m.parentNode.replaceChild(mk('$'+tex+'$'),m);
  });
  z.file('word/document.xml',new XMLSerializer().serializeToString(doc));
  return {buf:await z.generateAsync({type:'arraybuffer'}),n,bad};
}

/* ===== Crackers + confetti when a test ends ===== */
function crackers(){
  try{
    const old=document.getElementById('fxc');if(old)old.remove();
    const c=document.createElement('canvas');c.id='fxc';c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';
    document.body.appendChild(c);
    const dpr=Math.min(window.devicePixelRatio||1,2),W=window.innerWidth,H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const cols=['#ffd84a','#ff5c8a','#4ade80','#38bdf8','#c084fc','#fb923c','#ffffff'],P=[];
    const burst=(cx,cy)=>{const col=cols[Math.random()*cols.length|0],n=54;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,s=2+Math.random()*4.6;P.push({k:'s',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.011+Math.random()*.008,c:col,r:1.8+Math.random()*1.6,g:.055})}};
    const conf=()=>{for(let i=0;i<80;i++)P.push({k:'c',x:Math.random()*W,y:-10-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,l:1,d:.0035,c:cols[Math.random()*cols.length|0],w:6+Math.random()*5,h:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,g:.015})};
    const t0=performance.now(),plan=[0,300,700,1100,1600,2100,2700].map(ms=>({ms,done:false}));let confDone=0;
    conf();
    (function frame(now){
      const e=now-t0;
      plan.forEach(s=>{if(!s.done&&e>=s.ms){s.done=true;burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4));if(s.ms===1100&&!confDone){confDone=1;conf()}}});
      x.clearRect(0,0,W,H);
      for(let i=P.length-1;i>=0;i--){
        const q=P[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.l-=q.d;
        if(q.k==='s'){q.vx*=.985}else{q.a+=q.va;q.vx*=.99}
        if(q.l<=0||q.y>H+20){P.splice(i,1);continue}
        x.globalAlpha=Math.max(0,Math.min(1,q.l*1.4));x.fillStyle=q.c;
        if(q.k==='s'){x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill()}
        else{x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()}
      }
      if(e<5200||P.length)requestAnimationFrame(frame);else c.remove();
    })(t0);
    setTimeout(()=>{if(c.parentNode)c.remove()},9000);
  }catch(e){}
}

  if(!items.length)return h('<h1>My progress</h1><div class="card mut">You haven’t taken any tests yet.</div><button onclick="home()">Back</button>');
  const pct=x=>Math.round(x.score/x.total*100),avg=Math.round(items.reduce((s,x)=>s+pct(x),0)/items.length),best=Math.max(...items.map(pct));
  const box=(v,l)=>`<div class="card" style="flex:1;text-align:center;margin:0"><div class="big" style="font-size:26px">${v}</div><div class="mut">${l}</div></div>`;
  let o=`<h1>My progress</h1><p class="mut">${esc(myName)}</p><div class="row" style="gap:10px;flex-wrap:nowrap">${box(Object.keys(mineAll).length,'Tests taken')}${box(avg+'%','Average')}${box(best+'%','Best')}</div>`;
  items.forEach(x=>{const t=tests.find(y=>y.id===x.id),p=pct(x);
    o+=`<div class="card"><div class="row sp"><b>${esc(t?t.title:'(deleted test)')}${x.n>1?' · Attempt '+(x.ai+1):''}</b><span>${x.score}/${x.total}</span></div><div class="mut">${t?esc(t.section||'Other')+' · ':''}${new Date(x.at).toLocaleDateString()}${x.times?' · ⏱ '+ft(x.times.reduce((a,b)=>a+(b||0),0)):''}</div><div style="background:var(--ac2);border-radius:6px;height:10px;margin:8px 0"><div style="width:${p}%;height:10px;border-radius:6px;background:${p>=60?'var(--ok)':p>=35?'var(--ac)':'var(--bad)'}"></div></div><div class="row sp"><span class="mut">${p}%</span>${t?`<button class="sec" onclick="showReview('${x.id}','p',${x.ai})">Review answers</button>`:''}</div></div>`});
  h(o+`<button onclick="home()">Back</button>`);
}
const ft=s=>{s=Math.round(s||0);return s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s'};
const qTag=(q,a,times,i)=>{const sk=a==null||a<0,ok=a===q.answer,c=sk?'#6b7280':ok?'#15803d':'#c62828';return `<div class="row sp" style="margin-bottom:6px;flex-wrap:nowrap"><span class="mut">${times&&times[i]!=null?'⏱ '+ft(times[i]):''}</span><span style="background:${c};color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:12px">${sk?'– Not attempted':ok?'✓ Correct':'✗ Wrong'}</span></div>`};
const tmBadge=(a,i)=>a&&a[i]!=null?`<span class="mut" style="float:right">⏱ ${ft(a[i])}</span>`:'';
function timeChips(t,x){
  if(!x.times)return '<div class="mut">Time not recorded</div>';
  const tot=x.times.reduce((a,b)=>a+(b||0),0),an=x.answers||[];
  return `<div class="mut" style="margin-bottom:6px">⏱ Total time: <b>${ft(tot)}</b></div><div class="row" style="gap:6px">${t.questions.map((q,i)=>{const sk=an[i]<0,ok=an[i]===q.answer;return `<span style="padding:3px 8px;border-radius:8px;background:var(--ac2);font-size:13px">Q${i+1} <span style="color:var(--${sk?'mut':ok?'ok':'bad'})">${sk?'–':ok?'✓':'✗'}</span> ${ft(x.times[i]||0)}</span>`}).join('')}</div>`;
}
function showReview(id,from,k){normMine();
  const t=tests.find(x=>x.id===id),rec=(k!=null&&k!==''&&mineAll[id])?mineAll[id][k]:mine[id];if(!t||!rec)return;
  const ans=rec.answers||[],times=rec.times||[];
  let o=`<h1>${esc(t.title)}${(mineAll[id]||[]).length>1?' – Attempt '+(rec.attempt||1):''}</h1><div class="card" style="text-align:center"><div class="big">${rec.score}/${rec.total}</div></div>${brk(t,rec)}`;
  t.questions.forEach((q,i)=>{o+=`<div class="card">${qTag(q,ans[i],times,i)}<b>${i+1}. ${fmt(q.q)}</b>${imgQ(q)}`;q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===ans[i]?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓':''}${j===ans[i]&&j!==q.answer?' ✗':''}</div>`);o+='</div>'});
  h(o+`<button onclick="${from==='p'?'progress()':'home()'}">Back</button>`);
}
init();
</script>
