main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--bad);padding:6px 8px}
button:disabled{opacity:.5}
button.gold{background:linear-gradient(135deg,#fff3b0 0%,#f5c518 30%,#c99700 55%,#ffe27a 80%,#e0aa00 100%);color:#3a2800;border:1px solid #b88a00;font-weight:700;box-shadow:0 2px 5px rgba(120,90,0,.3),inset 0 1px 2px rgba(255,255,255,.7)}button.gold.on{outline:3px solid #3a2800;outline-offset:1px}button.bg{background:#1d4ed8;color:#ffe9a6;font-weight:700;border-radius:12px;padding:12px 18px}.idl{background:linear-gradient(145deg,#ffffff,#cfe0d5);border-radius:22px;padding:12px 12px 6px;margin:12px 0 4px;border:1px solid #bcd0c4;box-shadow:9px 9px 18px rgba(0,0,0,.28),-6px -6px 14px rgba(255,255,255,.95),inset 0 1px 3px #fff,inset 0 -3px 6px rgba(0,0,0,.08)}.idl img,.idl .ph{box-shadow:0 8px 12px rgba(0,0,0,.4),0 0 0 3px #fff}button.bl{background:#1d4ed8;color:#fff;border-radius:10px;padding:11px 4px;font-size:15px;line-height:1.2;min-width:0}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 button{width:100%}.wt{display:block;width:100%;overflow:hidden;font-size:30px;font-weight:800;margin:0;white-space:nowrap;line-height:1.15;background:linear-gradient(90deg,#1d4ed8,#7c3aed 55%,#c99700);-webkit-background-clip:text;background-clip:text;color:transparent}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=email],input[type=datetime-local],textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:600;z-index:5}
.qb{border:1px dashed var(--bd);border-radius:10px;padding:12px;margin:10px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.big{font-size:40px;font-weight:700;color:var(--ac)}
textarea{resize:vertical}.qimg{max-width:100%;border-radius:8px;display:block;margin:8px 0}.oimg{max-width:100%;max-height:160px;border-radius:6px;display:block;margin-top:6px}.pv{padding:2px 4px;overflow-x:auto}.mkbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;padding:4px 0}.mkgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:6px}.mkb{padding:6px 10px;background:var(--ac2);color:var(--ac);min-width:40px}
.pill{border-radius:20px;padding:9px 14px;color:#fff;margin:4px 6px 4px 0}.pill.ok{background:#1d4ed8}.pill.no{background:#8b0000}.pill.stk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;position:relative;margin:0 0 12px;padding:10px 16px;font:600 26px/1.2 'Caveat','Segoe Script','Bradley Hand',cursive;color:#fff;border:0;text-align:left;border-radius:16px}.pill.stk .sc{font-size:22px;white-space:nowrap}.pill.stk .st{position:absolute;top:-10px;right:-4px;font-size:24px;line-height:1}.gbox{background:linear-gradient(135deg,#fff3b0 0%,#f5c518 30%,#c99700 55%,#ffe27a 80%,#e0aa00 100%);color:#3a2800;border-radius:16px;border:1px solid #b88a00;box-shadow:0 2px 6px rgba(120,90,0,.35),inset 0 1px 2px rgba(255,255,255,.7);min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px}.gbox .big{font-size:28px;font-weight:800;color:#3a2800}.gbox .l{font-size:14px;font-weight:600;margin-top:4px;line-height:1.25}.nvbar{display:flex;flex-wrap:wrap;gap:6px}.nv{min-width:40px;padding:8px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.nv.dn{background:var(--ac);color:#fff;border-color:var(--ac)}.nv.cu{outline:2px solid var(--tx);outline-offset:1px}

.card{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,214,90,.55);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.p3d,.idl{background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(207,224,213,.74));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,214,90,.6)}

function idolOff(){const b=document.getElementById('ib');if(b){b.classList.remove('on');b.dataset.i=''}document.querySelectorAll('.ic.sel').forEach(x=>x.classList.remove('sel'))}
function idol(i,el){
  const b=document.getElementById('ib');if(!b)return;
  if(b.classList.contains('on')&&b.dataset.i===String(i))return idolOff();
  idolOff();el.classList.add('sel');
  const d=IDDESC[PHYS[i][0]]||[PHYS[i][0],''];
  b.innerHTML='<b>'+esc(d[0])+'</b>'+esc(d[1]).replace(/(\d+)(st|nd|rd|th)\b/g,'$1<sup>$2</sup>')+'<span class="tl"></span>';b.dataset.i=i;b.classList.add('on');
  const P=b.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect(),w=Math.min(P.width-16,270),cx=r.left+r.width/2-P.left;
  b.style.width=w+'px';const left=Math.max(8,Math.min(cx-w/2,P.width-w-8));b.style.left=left+'px';
  b.querySelector('.tl').style.left=(cx-left-7)+'px';b.style.bottom=(P.bottom-r.top+10)+'px';
}

// Login loader: photon wave hits the electron, electron jumps out and falls back, energy packets + "E = hc/λ"
// One cycle = LG_CYC ms. The loader stays for at least 2 full cycles on every login.
const LG_SPEED=2, LG_CYC=9900/LG_SPEED, LG_MIN=2*LG_CYC;
let lgStartT=0;
function startLgFx(){
  const cv=document.getElementById('lgc');if(!cv)return;
  const x=cv.getContext('2d');
  const S=2,C=150,RI=90,RO=142,RS=160;
  const A0=-Math.PI/4;
  const EX=C+Math.cos(A0)*RI, EY=C+Math.sin(A0)*RI;
  const SX=C+Math.cos(A0)*RS, SY=C+Math.sin(A0)*RS;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const T_HIT=2800,T_JUMP=2000,T_SIT=1000,T_FALL=2000,T_EMIT=1200,GAP=900;
  const T1=T_HIT,T2=T1+T_JUMP,T3=T2+T_SIT,T4=T3+T_FALL,T5=T4+T_EMIT,TEND=T5+GAP; // TEND === LG_CYC
  const trail=[],packets=[];
  let seq=null,lastShed=0,lastEmit=-1e9,emitCount=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function drawPhoton(k){
    const L=Math.hypot(EX-SX,EY-SY), ux=(EX-SX)/L, uy=(EY-SY)/L, px=-uy, py=ux;
    const n=3.5, A=6;
    x.beginPath();
    for(let i=0;i<=160;i++){
      const u=i/160*k;
      const bx=SX+(EX-SX)*u, by=SY+(EY-SY)*u;
      const off=A*Math.sin(2*Math.PI*n*u);
      const qx=bx+px*off, qy=by+py*off;
      i?x.lineTo(qx,qy):x.moveTo(qx,qy);
    }
    x.lineCap='round';
    x.strokeStyle='rgba(255,40,40,1)';x.lineWidth=3.2;x.shadowColor='rgba(255,40,40,1)';x.shadowBlur=14;x.stroke();
    x.strokeStyle='rgba(255,235,220,1)';x.lineWidth=1.1;x.shadowColor='rgba(255,120,120,1)';x.shadowBlur=6;x.stroke();x.shadowBlur=0;
    {const hx=SX+(EX-SX)*k, hy=SY+(EY-SY)*k;
     const lx=hx-px*18, ly=hy-py*18;
     const al=Math.min(1,k/0.12)*Math.min(1,(1-k)/0.25);
     if(al>0.01){x.save();x.globalAlpha=al;
       x.font='bold 11px Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';
       x.fillStyle='rgba(255,235,220,1)';x.shadowColor='rgba(255,40,40,1)';x.shadowBlur=6;
       x.fillText('EM Wave',lx,ly);x.restore();}}
    if(k>0.97){
      const hx=EX, hy=EY, ah=10;
      x.beginPath();x.moveTo(hx,hy);
      x.lineTo(hx-ux*ah+px*ah*.5,hy-uy*ah+py*ah*.5);
      x.lineTo(hx-ux*ah-px*ah*.5,hy-uy*ah-py*ah*.5);x.closePath();
      x.fillStyle='rgba(255,40,40,1)';x.shadowColor='rgba(255,40,40,1)';x.shadowBlur=12;x.fill();x.shadowBlur=0;
    }
  }
  const frame=raw=>{
    if(!document.getElementById('lgc'))return;
    if(seq===null)seq=raw;
    let now=(raw-seq)*LG_SPEED;
    if(now>=TEND){seq=raw;now=0;lastShed=0;lastEmit=-1e9;emitCount=0;packets.length=0;trail.length=0}
    const tt=now;
    let r=RI;
    if(tt<T1){
      const k=tt/T1;
      if(tt-lastShed>240){lastShed=tt;
        const hx=SX+(EX-SX)*k, hy=SY+(EY-SY)*k;
        trail.push({x:hx,y:hy,vx:rnd(-6,6),vy:rnd(-6,6),t0:now,life:1100});}
    }else if(tt<T2){ r=RI+(RO-RI)*ease((tt-T1)/T_JUMP); }
    else if(tt<T3){ r=RO; }
    else if(tt<T4){ r=RO-(RO-RI)*ease((tt-T3)/T_FALL); }
    else { r=RI; }
    // packets only while the electron leaves the upper shell (falling back): 3 releases
    if(tt>=T3&&tt<T4&&emitCount<3&&tt-lastEmit>T_FALL/4){lastEmit=tt;emitCount++;
      const dx=Math.cos(A0),dy=Math.sin(A0);
      const ex0=C+dx*r, ey0=C+dy*r;
      const sp=rnd(26,36), spread=rnd(-0.5,0.5);
      const ang=A0+spread;
      packets.push({x:ex0,y:ey0,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,t0:now,life:rnd(1500,1900),kind:'p'});
      if(emitCount===1)packets.push({x:ex0+dx*12,y:ey0+dy*12-10,vx:0,vy:0,t0:now,life:1900,kind:'t'});
    }
    x.clearRect(0,0,600,600);x.save();x.scale(S,S);
    [RI,RO].forEach(rr=>{x.beginPath();x.arc(C,C,rr,0,Math.PI*2);x.strokeStyle='rgba(255,226,122,.45)';x.lineWidth=1.4;x.setLineDash([4,4]);x.stroke();x.setLineDash([]);});
    if(tt<T1)drawPhoton(tt/T1);
    const ex=C+Math.cos(A0)*r, ey=C+Math.sin(A0)*r;
    const hot=tt>=T1&&tt<T4;
    const g=x.createRadialGradient(ex,ey,0,ex,ey,hot?12:9);
    g.addColorStop(0,hot?'rgba(255,255,255,1)':'rgba(255,240,170,1)');
    g.addColorStop(.35,hot?'rgba(127,231,255,.9)':'rgba(245,197,24,.9)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(ex,ey,hot?12:9,0,Math.PI*2);x.fill();
    for(let i=trail.length-1;i>=0;i--){const p=trail[i],k=(now-p.t0)/p.life;
      if(k>=1){trail.splice(i,1);continue}
      p.x+=p.vx/60;p.y+=p.vy/60;const a=1-k;
      x.fillStyle='rgba(255,120,120,'+a+')';x.shadowColor='rgba(255,80,80,1)';x.shadowBlur=6;
      x.beginPath();x.arc(p.x,p.y,1.8*a+.5,0,Math.PI*2);x.fill();x.shadowBlur=0;}
    for(let i=packets.length-1;i>=0;i--){const p=packets[i];
      if(now<p.t0)continue;const k=(now-p.t0)/p.life;
      if(k>=1){packets.splice(i,1);continue}
      if(p.kind==='p'&&k>0.8){
        for(let j=0;j<7;j++){const a=rnd(0,Math.PI*2),sp=rnd(18,34);
          packets.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t0:now,life:rnd(330,460),kind:'s'});}
        packets.splice(i,1);continue;
      }
      if(p.kind==='t'){
        x.save();x.globalAlpha=Math.min(1,k/0.1)*(1-k);
        x.font='bold 11px Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';
        x.fillStyle='rgba(255,235,160,1)';x.shadowColor='rgba(255,200,80,1)';x.shadowBlur=6;
        x.fillText('E = hc/λ',p.x,p.y);x.restore();continue;
      }
      p.x+=p.vx/60;p.y+=p.vy/60;
      if(p.kind==='s'){p.vx*=.96;p.vy*=.96}
      const a=1-k;
      if(p.kind==='p'){
        x.fillStyle='rgba(255,236,160,'+a+')';x.shadowColor='rgba(255,226,122,1)';x.shadowBlur=7;
        x.beginPath();x.arc(p.x,p.y,2*a+.6,0,Math.PI*2);x.fill();x.shadowBlur=0;
      }else{
        const m=Math.hypot(p.vx,p.vy)||1;
        x.strokeStyle='rgba(255,236,160,'+a+')';x.lineWidth=1.5*a+.3;x.lineCap='round';
        x.shadowColor='rgba(255,226,122,1)';x.shadowBlur=6;
        x.beginPath();x.moveTo(p.x-p.vx/m*3.5,p.y-p.vy/m*3.5);x.lineTo(p.x,p.y);x.stroke();x.shadowBlur=0;
      }
    }
    x.restore();requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function ytId(u){
  u=(u||'').trim();let m='';
  if(/^[\w-]{11}$/.test(u))return u;
  try{
    const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u),hn=x.hostname.replace(/^(www|m|music)\./,'');
    if(hn==='youtu.be')m=x.pathname.slice(1).split('/')[0];
    else if(hn==='youtube.com'||hn==='youtube-nocookie.com'){
      if(x.pathname==='/watch')m=x.searchParams.get('v')||'';
      else{const p=x.pathname.split('/');if(['embed','shorts','live','v'].includes(p[1]))m=p[2]||''}
    }
  }catch(e){}
  return /^[\w-]{11}$/.test(m||'')?m:'';
}

let fm={list:[],o:null,edit:null,pgs:[],pre:null,cache:{},busy:false};
const FMMAX=20;
async function fmLoad(admin){

  const l=await r.get();

async function pdfLib(){
  if(window.pdfjsLib)return;
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const w=await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
}
function fmJpg(src,sw,sh){
  let w=Math.min(1000,sw),q=.75,out='';
  for(let i=0;i<6;i++){
    const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(sh*w/sw);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);
    if(out.length<850000)return out;
    q-=.1;w*=.85;
  }
  return out;
}
function fmImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{try{ok(fmJpg(i,i.naturalWidth,i.naturalHeight))}catch(e){no(e)}URL.revokeObjectURL(u)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Could not read this image.'))};i.src=u})}
async function fmPdf(file,add){
  await pdfLib();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  for(let n=1;n<=pdf.numPages;n++){
    if(fm.pgs.length>=FMMAX)throw new Error('Maximum '+FMMAX+' pages per topic.');
    const pg=await pdf.getPage(n),v0=pg.getViewport({scale:1}),sc=Math.min(1000,Math.max(700,v0.width*2))/v0.width,v=pg.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:v}).promise;
    add(fmJpg(c,c.width,c.height));
    fmSt('Converting page '+n+' of '+pdf.numPages+'…');
  }
}
const fmSt=m=>{const e=document.getElementById('fms');if(e)e.textContent=m};
function fmThumbs(){
  const e=document.getElementById('fmt');if(!e)return;
  const bs='padding:4px 0;min-width:0;font-size:13px';
  e.innerHTML=fm.pgs.map((g,i)=>`<div style="background:#fff8;border-radius:10px;padding:6px"><div style="position:relative"><img src="${g.img}" style="width:100%;border-radius:8px;display:block;background:#fff"><span style="position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;font-size:11px;padding:1px 6px;border-radius:6px">Page ${i+1}${g.src===null?' · new':''}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px"><button class="sec" style="${bs}" onclick="fmRep(${i})">Replace</button><button class="del" style="${bs}" onclick="fmRm(${i})">Remove</button><button class="sec" style="${bs}" ${i===0?'disabled':''} onclick="fmMv(${i},-1)">‹ Move</button><button class="sec" style="${bs}" ${i===fm.pgs.length-1?'disabled':''} onclick="fmMv(${i},1)">Move ›</button></div></div>`).join('');
}
function fmRep(i){fm.rep=i;const x=document.getElementById('frep');if(x)x.click()}
async function fmRepDo(inp){
  const f=inp.files[0];inp.value='';if(!f||fm.rep==null||fm.busy)return;
  fm.busy=true;fmSt('Converting…');
  try{fm.pgs[fm.rep]={img:await fmImg(f),src:null};fmThumbs();fmSt('Page '+(fm.rep+1)+' replaced. Tap Save changes to keep it.')}
  catch(e){fmSt('Could not convert: '+(e.message||e))}
  fm.busy=false;
}
function fmRm(i){if(fm.pgs.length<2)return fmSt('A topic needs at least one page.');fm.pgs.splice(i,1);fmThumbs();fmSt(fm.pgs.length+' pages. Tap Save changes to keep this.')}
function fmMv(i,d){const j=i+d;if(j<0||j>=fm.pgs.length)return;[fm.pgs[i],fm.pgs[j]]=[fm.pgs[j],fm.pgs[i]];fmThumbs()}
async function fmPick(inp){
  const fs=[...inp.files];inp.value='';if(!fs.length||fm.busy)return;
  fm.busy=true;fmSt('Converting…');
  try{
    for(const f of fs){
      if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name))await fmPdf(f,g=>{fm.pgs.push({img:g,src:null});fmThumbs()});
      else{if(fm.pgs.length>=FMMAX)throw new Error('Maximum '+FMMAX+' pages per topic.');fm.pgs.push({img:await fmImg(f),src:null});fmThumbs()}
    }
    fmSt(fm.pgs.length+' page'+(fm.pgs.length==1?'':'s')+' ready.');
  }catch(e){fmThumbs();fmSt('Could not convert: '+(e.message||e))}
  fm.busy=false;
}

  const {t,ans}=cur,n=t.questions.length,un=[];ans.forEach((a,k)=>{if(a<0)un.push(k)});
  h(`<div class="timer" id="tm"></div><h1>Submit test?</h1><div class="card"><p>You have answered <b>${n-un.length}</b> of <b>${n}</b> questions.</p>${un.length?`<p>Not answered:</p><div class="nvbar">${un.map(k=>`<button class="nv" onclick="goQ(${k})">${k+1}</button>`).join('')}</div><p class="mut">Tap a number to go back to that question.</p>`:''}<div style="border:2px solid var(--bad);background:rgba(220,60,60,.12);border-radius:12px;padding:12px;margin:10px 0;font-weight:700;color:var(--bad)">⚠️ Warning: ${un.length?un.length+' question'+(un.length>1?'s are':' is')+' still unanswered. ':''}Once you submit, you cannot change your answers or take this test again.</div><div class="row"><button onclick="goQ(${un.length?un[0]:cur.i})">Go back and review</button><button style="background:var(--bad);color:#fff" onclick="submit(false)">Yes, submit now</button></div></div>`);
  tick();
}
async function saveRec(rec){
  const k=rec.attempt>1?rec.attempt:0;
  await db.collection('results').doc(rec.testId+'_'+uid+(k?'_'+k:'')).set(rec);
  await db.collection('users/'+uid+'/results').doc(rec.testId+(k?'__'+k:'')).set(rec);
  try{await db.collection('users/'+uid+'/attempts').doc(rec.testId).delete()}catch(e){}
  delete att[rec.testId];const L=mineAll[rec.testId]=mineAll[rec.testId]||[];if(!L.some(z=>(z.attempt||1)===(rec.attempt||1)))L.push(rec);mine[rec.testId]=L[L.length-1];
}
async function submit(auto,leftAt){
  if(!cur)return;
  clearInterval(timer);timer=null;
  document.removeEventListener('visibilitychange',onVis);window.removeEventListener('pagehide',onHide);
  const {t,ans}=cur,times=cur.times.map(v=>Math.round(v/1000));cur=null;
  const mk=hasNeg(t),nq=t.questions.length,cc=ans.reduce((n,a,i)=>n+(a===t.questions[i].answer?1:0),0),ww=ans.reduce((n,a,i)=>n+(a>=0&&a!==t.questions[i].answer?1:0),0);
  const total=mk?4*nq:nq,score=mk?4*cc-ww:cc;
  pend={rec:{testId:t.id,uid,name:myName,email:myEmail,score,total,answers:ans,times,at:leftAt||Date.now(),...(leftAt?{left:1}:{}),...(mk?{mk:1}:{}),...((mineAll[t.id]||[]).length?{attempt:mineAll[t.id].length+1}:{})},auto};
  await finishSave();
}
async function finishSave(){
  const {rec,auto}=pend;
  h('<p class="mut">Saving your answers…</p>');
  try{await saveRec(rec)}
  catch(e){return h('<div class="card"><h2>Could not save your answers</h2><p>Please check your internet connection and try again. Do not close this page.</p><button onclick="finishSave()">Try again</button></div>')}
  pend=null;showResult(rec.testId,auto,true);
}

/* ===== Crackers + confetti when a test ends ===== */
function crackers(){
  try{
    const old=document.getElementById('fxc');if(old)old.remove();
    const c=document.createElement('canvas');c.id='fxc';c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';
    document.body.appendChild(c);
    const dpr=Math.min(window.devicePixelRatio||1,2),W=window.innerWidth,H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const cols=['#ffd84a','#ff5c8a','#4ade80','#38bdf8','#c084fc','#fb923c','#ffffff'],P=[];
    const burst=(cx,cy)=>{const col=cols[Math.random()*cols.length|0],n=54;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,s=2+Math.random()*4.6;P.push({k:'s',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.011+Math.random()*.008,c:col,r:1.8+Math.random()*1.6,g:.055})}};
    const conf=()=>{for(let i=0;i<80;i++)P.push({k:'c',x:Math.random()*W,y:-10-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,l:1,d:.0035,c:cols[Math.random()*cols.length|0],w:6+Math.random()*5,h:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,g:.015})};
    const t0=performance.now(),plan=[0,300,700,1100,1600,2100,2700].map(ms=>({ms,done:false}));let confDone=0;
    conf();
    (function frame(now){
      const e=now-t0;
      plan.forEach(s=>{if(!s.done&&e>=s.ms){s.done=true;burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4));if(s.ms===1100&&!confDone){confDone=1;conf()}}});
      x.clearRect(0,0,W,H);
      for(let i=P.length-1;i>=0;i--){
        const q=P[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.l-=q.d;
        if(q.k==='s'){q.vx*=.985}else{q.a+=q.va;q.vx*=.99}
        if(q.l<=0||q.y>H+20){P.splice(i,1);continue}
        x.globalAlpha=Math.max(0,Math.min(1,q.l*1.4));x.fillStyle=q.c;
        if(q.k==='s'){x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill()}
        else{x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()}
      }
      if(e<5200||P.length)requestAnimationFrame(frame);else c.remove();
    })(t0);
    setTimeout(()=>{if(c.parentNode)c.remove()},9000);
  }catch(e){}
}
function scoreMsg(p){const n=((typeof myName==='string'&&myName.trim().split(/\s+/)[0])||'').replace(/[<>&]/g,''),c=n?', '+n:'';
  if(p>=90)return ['🏆','Brilliant work! Your concepts are crystal clear. Now sharpen your speed and keep revising. 🚀'];
  if(p>=75)return ['👏','Very well done'+c+'! A little more effort and 90+ is yours.'];
  if(p>=50)return ['👍','You are on the right track! Review the questions you got wrong and solve them again. 📘'];
  return ['🌟','Every expert was once a beginner'+c+'. Revise the basics and come back stronger. 🌟']}
function scorePop(rec){try{const old=document.getElementById('spop');if(old)old.remove();
  const m=scoreMsg(Math.max(0,rec.score/rec.total*100)),d=document.createElement('div');d.id='spop';
  d.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;pointer-events:none;padding:20px;animation:spIn .35s ease-out';
  d.innerHTML='<div style="background:#1b1f2b;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:26px 22px;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)"><div style="font-size:52px">'+m[0]+'</div><div style="font-size:30px;font-weight:700;margin:6px 0">'+rec.score+'/'+rec.total+'</div><div style="font-size:16px;line-height:1.5">'+m[1]+'</div></div>';
  if(!document.getElementById('spst')){const st=document.createElement('style');st.id='spst';st.textContent='@keyframes spIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}';document.head.appendChild(st)}
  document.body.appendChild(d);setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(()=>d.remove(),450)},7000)}catch(e){}}
function showResult(id,auto,fx){normMine();wmOn=true;
  const t=tests.find(x=>x.id===id),rec=mine[id];if(!t||!rec)return home();
  const ans=rec.answers||[],times=rec.times||[];
  let o=`<h1>${auto==='left'?'Test submitted':auto?'Time’s up!':'Submitted!'}${rec.attempt>1?' (Attempt '+rec.attempt+')':''}</h1><div class="card" style="text-align:center"><div style="font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--ac)">The Wave Academy</div><div class="big">${rec.score}/${rec.total}</div><div class="mut">${Math.round(rec.score/rec.total*100)}%</div>${(()=>{const m=scoreMsg(Math.max(0,rec.score/rec.total*100));return '<div class="'+(auto==='left'?'':'blk')+'" style="margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:15px;line-height:1.5"><span style="font-size:22px">'+m[0]+'</span><br>'+m[1]+'</div>'})()}</div>${auto==='left'?'<div class="blk" style="text-align:left;border:2px solid #ff9a9a;background:#8b1d1d;border-radius:12px;padding:12px 14px;margin:0 0 14px;max-width:92%;color:#fff;line-height:1.5"><b>⚠️ Test Automatically Submitted!</b><br><span style="font-size:14px">Your test has been automatically submitted because you switched away from the test screen.</span></div>':''}${brk(t,rec)}<h2>Review</h2>`;
  t.questions.forEach((q,i)=>{
    o+=`<div class="card">${qTag(q,ans[i],times,i)}<b>${i+1}. ${fmt(q.q)}</b>${imgQ(q)}`;
    q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===ans[i]?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓':''}${j===ans[i]&&j!==q.answer?' ✗':''}</div>`);
    o+=`</div>`;
  });
  h(o+`<button onclick="home()">Back to tests</button>`);if(fx){crackers();scorePop(rec)}
}

  const t=tests.find(x=>x.id===id);if(!t)return home();

  try{
    const [u0,u2,r]=await Promise.all([db.collection('users').where('sec','==',t.section).get(),db.collection('users').where('extra','array-contains',t.section).get(),db.collection('results').where('testId','==',id).get()]),u=uniqDocs(u0,u2);
    const sub={},al={},rtm={};r.docs.forEach(d=>{const x=d.data();(al[x.uid]=al[x.uid]||[]).push(nr(x))});Object.keys(al).forEach(k=>{al[k].sort((a,b)=>(a.attempt||1)-(b.attempt||1));sub[k]=al[k][al[k].length-1]});
    try{(await db.collection('retakes').where('testId','==',id).get()).docs.forEach(d=>{rtm[d.data().uid]=d.data().allowed||1})}catch(e){}
    const rows=u.docs.filter(d=>d.id!==uid).map(d=>({uid:d.id,name:d.data().name,mobile:d.data().email,active:d.data().active,res:sub[d.id]||null,all:al[d.id]||[],allowed:rtm[d.id]||1})).filter(r=>r.active!==false||r.res);

    rcache={t,rows};drawResults();
  }catch(e){h('<div class="card">Could not load students: '+esc(e.message||e)+'. Make sure you published the latest Firebase rules.</div><button onclick="home()">Back</button>')}
}

async function paperPdf(id,key){
  const t=tests.find(x=>x.id===id);if(!t)return;
  const R={'Class IX':'9','Class X':'10','Physics XI':'11','Physics XII':'12'};
  const RN={'9':'IX','10':'X','11':'XI','12':'XII'};
  const cn=R[t.section]||'',sub=isSub(t.section)?(t.subject||'Science'):'Physics';
  const X=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const pp=document.getElementById('pp');
  try{await Promise.all([document.fonts.load('700 38px LB'),document.fonts.load('12px LB')])}catch(e){}
  const qHtml=(q,i)=>{
    let o=`<div class="pp-q"><div class="pp-n">Q${i}.</div><div>${fmt(q.q)}</div>${imgQ(q)}<div class="pp-o">`;
    q.options.forEach((op,j)=>o+=`<div>${'abcd'[j]}) ${optHtml(q,j)}${key&&q.answer===j?' <span style="color:#15803d;font-weight:700">&#10004;</span>':''}</div>`);
    return o+`</div>${key?'':'<div class="pp-a">Answer:</div>'}</div>`;
  };
  const hdr=`<div class="hd"><h1>The Wave Academy</h1><div class="sb">${cn?'Class '+(RN[cn]||cn)+' _ ':''}${X(sub)}</div><div class="sb">Topic: ${X(t.title||'')}</div><img src="${WLOGO}" alt=""></div><div class="rl"></div>`;
  const qs=t.questions;
  const pageHtml=(start,list,pno,numbered)=>`<div class="pp-page"><div class="pp-wm">THE WAVE ACADEMY</div>${hdr}<div class="cl">${list.map((q,i)=>qHtml(q,start+i+1)).join('')}</div><div class="pp-ft"><span>By Parmod Kumar</span><span>&#9742; 9999715042</span></div><div class="pp-pg">Page ${pno}</div></div>`;
  // measure offscreen: does this many questions fit in the two columns of one page?
  pp.className='go';
  const fits=(start,cnt,pno)=>{pp.innerHTML=pageHtml(start,qs.slice(start,start+cnt),pno);const cl=pp.querySelector('.cl');return cl.scrollWidth<=cl.clientWidth+1};
  const plan=[];let i=0;
  while(i<qs.length){
    let k=1;
    while(i+k<qs.length&&fits(i,k+1,plan.length+1))k++;
    plan.push([i,k]);i+=k;
  }
  pp.innerHTML=plan.map(([s,c],pi)=>pageHtml(s,qs.slice(s,s+c),pi+1)).join('');
  pp.className='';
  const old=document.title;document.title=(t.title||'Question paper')+(key?' - Answer key':' - Question paper');
  const done=()=>{document.title=old;pp.innerHTML='';pp.className='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),300);
}
function drawResults(){
  const t=rcache.t,rows=rcache.rows,done=rows.filter(x=>x.res),no=rows.filter(x=>!x.res);
  done.sort((a,b)=>b.res.score-a.res.score||(a.name||'').localeCompare(b.name||''));
  no.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const avg=done.length?(done.reduce((s,x)=>s+x.res.score,0)/done.length).toFixed(1):'–';
  let o=`<button class="sec" onclick="home()">← Back</button><h1 style="margin-top:12px">${esc(t.title)}</h1><p class="mut">${esc(t.section||'')}${isSub(t.section)?' · '+esc(t.subject||'Science'):''} · ${t.questions.length} questions · ${durMin(t)} min</p>
  <div class="row" style="margin:8px 0"><button class="sec" onclick="editTest('${t.id}')">✏️ Edit test</button><button class="sec" onclick="paperPdf('${t.id}',false)">📄 Question paper PDF</button><button class="sec" onclick="paperPdf('${t.id}',true)">📄 PDF with answer key</button><button class="sec" id="shr" onclick="shareResult()">📷 Share result as JPG</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div class="gbox"><div class="big">${done.length}</div><div class="l">Attempted</div></div><div class="gbox"><div class="big">${no.length}</div><div class="l">Not attempted</div></div><div class="gbox"><div class="big">${avg}</div><div class="l">Average score</div></div></div>
  <p class="mut" style="margin:14px 0 4px"><span style="color:#1d4ed8">●</span> Blue = attempted (tap for test analysis) &nbsp; <span style="color:#8b0000">●</span> Dark red = not attempted</p><div>`;
  const topS=done.length?done[0].res.score:null;
  done.forEach(x=>o+=`<button class="pill stk ok" onclick="analysis('${x.uid}')"><span>${esc(x.name)}${x.all.length>1?' <small style="opacity:.8">· Attempt '+x.all.length+'</small>':''}${x.allowed>x.all.length?' 🔁':''}${x.all.some(r=>r.left)?' ⚠️<small style="opacity:.9"> Left the app</small>':''}</span><span class="sc">${x.res.score}/${x.res.total}</span>${x.res.score===topS?'<span class="st">⭐</span>':''}</button>`);
  no.forEach(x=>o+=`<button class="pill stk no" onclick="notTaken('${x.uid}')"><span>${esc(x.name)}</span></button>`);
  if(!rows.length)o+='<div class="card mut">No students have joined this class yet.</div>';
  h(o+`</div><div id="nt"></div>`);
}
// Share result as JPG: draws the class result sheet on a canvas, then opens the share sheet (or downloads)
async function shareResult(){
  const btn=document.getElementById('shr');
  const t=rcache.t,rows=rcache.rows||[];
  const done=rows.filter(r=>r.res).sort((a,b)=>b.res.score-a.res.score||(a.name||'').localeCompare(b.name||''));
  const no=rows.filter(r=>!r.res).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const avg=done.length?(done.reduce((s,r)=>s+r.res.score,0)/done.length).toFixed(1):'–';
  const W=720,rh=40,lh=34;
  const yEnd=266+done.length*rh+(no.length?60+no.length*lh:0);
  const H=yEnd+50;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx=cv.getContext('2d');
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c96a2b');g.addColorStop(1,'#7a3410');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.textAlign='left';cx.textBaseline='alphabetic';
  cx.fillStyle='#ffe9b0';cx.font='bold 30px Arial, sans-serif';cx.fillText('The Wave Academy',32,58);
  cx.fillStyle='#ffffff';cx.font='bold 28px Arial, sans-serif';cx.fillText(String(t.title||'Test').slice(0,38),32,104);
  cx.fillStyle='#ffe9b0';cx.font='18px Arial, sans-serif';cx.fillText((t.section||'')+' · '+(t.questions||[]).length+' questions',32,134);
  cx.fillText('Attempted: '+done.length+'   Not attempted: '+no.length+'   Average: '+avg,32,166);
  cx.font='bold 18px Arial, sans-serif';cx.fillStyle='#ffe9b0';
  cx.fillText('Name',32,214);cx.textAlign='right';cx.fillText('Score',W-32,214);cx.textAlign='left';
  cx.fillRect(32,226,W-64,2);
  let y=266;cx.font='20px Arial, sans-serif';
  done.forEach((r,i)=>{
    cx.fillStyle='#ffffff';cx.fillText((i+1)+'. '+(r.name||''),32,y);
    cx.textAlign='right';cx.fillText(r.res.score+'/'+r.res.total,W-32,y);cx.textAlign='left';
    y+=rh;
  });
  if(no.length){
    y+=20;cx.fillStyle='#ffb3b3';cx.font='bold 18px Arial, sans-serif';cx.fillText('Not attempted',32,y);
    y+=lh-4;cx.font='18px Arial, sans-serif';
    no.forEach(r=>{cx.fillText(r.name||'',32,y);y+=lh});
  }
  cx.fillStyle='rgba(255,233,176,.7)';cx.font='14px Arial, sans-serif';cx.fillText('Generated from The Wave Academy',32,H-20);
  if(btn)btn.disabled=true;
  try{
    const blob=await new Promise((ok,bad)=>cv.toBlob(b=>b?ok(b):bad(new Error('Image could not be created')),'image/jpeg',.92));
    const name=String(t.title||'result').replace(/[^\w]+/g,'_')+'.jpg';
    const file=new File([blob],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:t.title||'Test result'});
    }else{
      const u=URL.createObjectURL(blob);const a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
    }
  }catch(e){if(!e||e.name!=='AbortError')alert('JPG nahi ban paya: '+(e&&e.message?e.message:e))}
  finally{if(btn)btn.disabled=false}
}
function notTaken(u){
  const x=rcache.rows.find(r=>r.uid===u),e=document.getElementById('nt');if(!x||!e)return;
  e.innerHTML=`<div class="card" style="border-color:#d64545"><b>${esc(x.name)}</b><div class="mut">${esc(x.mobile||'')}</div><p style="margin:6px 0 0;color:#d64545">Has not attempted this test yet.</p></div>`;
  e.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function analysis(u,k){
  const t=rcache.t,x=rcache.rows.find(r=>r.uid===u);if(!x||!x.res)return;
  if(k==null)k=x.all.length-1;
  const res=x.all[k]||x.res,n=t.questions.length,an=res.answers||[],tm=res.times||[];
  let cor=0,wr=0,sk=0;t.questions.forEach((q,i)=>{const a=an[i];if(a==null||a<0)sk++;else if(a===q.answer)cor++;else wr++});
  const done=rcache.rows.filter(r=>r.res),rank=1+done.filter(r=>r.uid!==u&&r.res.score>res.score).length;
  const avg=(done.reduce((s,r)=>s+r.res.score,0)/done.length).toFixed(1),tot=tm.reduce((a,b)=>a+(b||0),0);
  const slow=tm.map((v,i)=>({v:v||0,i})).sort((a,b)=>b.v-a.v).slice(0,3).filter(z=>z.v>0);
  let o=`<button class="sec" onclick="drawResults()">← All students</button><h1 style="margin-top:12px">${esc(x.name)}</h1><p class="mut">${esc(x.mobile||'')} · ${esc(t.title)}${x.all.length>1?' · Attempt '+(k+1):''}</p>
  ${x.all.length>1?`<div class="row" style="margin-bottom:8px">${x.all.map((r,i)=>`<button class="${i===k?'':'sec'}" onclick="analysis('${u}',${i})">Attempt ${i+1} · ${r.score}/${r.total}</button>`).join('')}</div>`:''}
  <div class="card">${x.allowed>x.all.length?`<span style="color:var(--ac)">🔁 Reassigned – waiting for the student to attempt again.</span> <button class="sec" onclick="unassign('${u}')">Cancel</button>`:(x.all.length>=10?'<span class="mut">Maximum 10 attempts reached.</span>':`<button onclick="reassign('${u}')">🔁 Reassign test (Attempt ${x.all.length+1})</button><div class="mut" style="margin-top:6px">Old scores stay as they are. The new score is saved as Attempt ${x.all.length+1}.</div>`)}</div>
  <div class="row" style="gap:10px;flex-wrap:nowrap">${box(res.score+'/'+res.total,'Score')}${box(Math.round(res.score/res.total*100)+'%','Percentage')}${box('#'+rank+' / '+done.length,'Rank')}</div>
  <div class="row" style="gap:10px;flex-wrap:nowrap;margin-top:10px">${box(cor,'Correct')}${box(wr,'Wrong')}${box(sk,'Skipped')}</div>${brk(rcache.t,res)}
  <div class="card"><div>⏱ Total time: <b>${tm.length?ft(tot):'not recorded'}</b>${tm.length?' · average '+ft(tot/n)+' per question':''}</div>${slow.length?`<div class="mut" style="margin-top:4px">Took the longest on: ${slow.map(z=>'Q'+(z.i+1)+' ('+ft(z.v)+')').join(', ')}</div>`:''}<div class="mut" style="margin-top:4px">Class average: ${avg}/${n} · Submitted ${new Date(res.at).toLocaleString()}</div></div><h2>Question-wise analysis</h2>`;
  t.questions.forEach((q,i)=>{
    const a=an[i],s=a==null||a<0,ok=a===q.answer;
    o+=`<div class="card"><div class="row sp"><b style="color:${s?'var(--mut)':ok?'var(--ok)':'var(--bad)'}">${s?'– Skipped':ok?'✓ Correct':'✗ Wrong'}</b>${tm.length?`<span class="mut">⏱ ${ft(tm[i]||0)}</span>`:''}</div><div style="margin:6px 0"><b>${i+1}. ${fmt(q.q)}</b></div>${imgQ(q)}`;
    q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===a?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓ correct answer':''}${j===a&&j!==q.answer?' ✗ student’s answer':''}${j===a&&j===q.answer?' (student’s answer)':''}</div>`);
    o+=`</div>`;
  });
  h(o+`<button onclick="drawResults()">Back to students</button>`);
}
async function setAllowed(tid,u,n){await db.collection('retakes').doc(tid+'_'+u).set({testId:tid,uid:u,allowed:n,at:Date.now()})}
async function reassign(u){
  const x=rcache.rows.find(r=>r.uid===u);if(!x)return;
  if(!confirm('Reassign this test to '+x.name+'?\n\nTheir old score will stay as it is. The new attempt will be saved as Attempt '+(x.all.length+1)+'.'))return;
  try{await setAllowed(rcache.t.id,u,x.all.length+1);x.allowed=x.all.length+1;analysis(u,x.all.length-1)}catch(e){alert('Could not reassign: '+(e.message||e)+'. Make sure you published the latest Firebase rules.')}
}
async function unassign(u){
  const x=rcache.rows.find(r=>r.uid===u);if(!x)return;
  try{await setAllowed(rcache.t.id,u,x.all.length);x.allowed=x.all.length;analysis(u,x.all.length-1)}catch(e){alert('Could not cancel: '+(e.message||e))}
}
async function reassignSt(tid,id,n,on){
  if(on&&!confirm('Reassign this test? Old score stays; the new score is saved as Attempt '+(n+1)+'.'))return;
  try{await setAllowed(tid,id,on?n+1:n);stuDetail(id)}catch(e){alert('Could not change: '+(e.message||e)+'. Make sure you published the latest Firebase rules.')}
}
async function refreshMine(){
  try{
    const [r,ar,rt]=await Promise.all([db.collection('users/'+uid+'/results').get(),db.collection('users/'+uid+'/attempts').get().catch(()=>({docs:[]})),db.collection('retakes').where('uid','==',uid).get().catch(()=>({docs:[]}))]);
    [mine,mineAll,att,allowed].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
    r.docs.forEach(d=>{const x=d.data();(mineAll[x.testId]=mineAll[x.testId]||[]).push(x)});
    Object.keys(mineAll).forEach(k=>{mineAll[k].sort((a,b)=>(a.attempt||1)-(b.attempt||1));mine[k]=mineAll[k][mineAll[k].length-1]});
    ar.docs.forEach(d=>att[d.id]=d.data());rt.docs.forEach(d=>{const x=d.data();allowed[x.testId]=x.allowed||1});
  }catch(e){}
}
let wipeFails=[];
async function wipeResults(tid,skip,only){
  wipeFails=[];
  const r=await db.collection('results').where('testId','==',tid).get();
  const us=new Set();
  r.docs.forEach(d=>{const u=d.data().uid;if((only?only.includes(u):!skip.includes(u)))us.add(u)});
  only&&only.forEach(u=>us.add(u));
  const tryDel=async(label,fn)=>{try{await fn()}catch(e){wipeFails.push(label+': '+(e.code||e.message||e))}};
  for(const d of r.docs){if(us.has(d.data().uid))await tryDel('result',()=>db.collection('results').doc(d.id).delete())}
  for(const u of us){
    try{const sr=await db.collection('users/'+u+'/results').where('testId','==',tid).get();for(const d of sr.docs)await tryDel('progress',()=>db.collection('users/'+u+'/results').doc(d.id).delete())}catch(e){wipeFails.push('progress list: '+(e.code||e.message||e))}
    await tryDel('attempt',()=>db.collection('users/'+u+'/attempts').doc(tid).delete());
    await tryDel('retake',()=>db.collection('retakes').doc(tid+'_'+u).delete());
  }
  if(wipeFails.length)alert('Some data could not be deleted:\n'+[...new Set(wipeFails)].join('\n')+'\n\nPlease make sure you published the latest Firebase rules.');
  return us.size;
}
async function togglePub(id,v){
  try{
    if(!v){
      const t=tests.find(x=>x.id===id),keep=(t&&t.assigned)||[];
      const r=await db.collection('results').where('testId','==',id).get(),n=new Set(r.docs.map(d=>d.data().uid).filter(u=>!keep.includes(u))).size;
      if(!confirm(n?'Unpublish this test?\n\n'+n+' student(s) have taken it. Their results for this test will be PERMANENTLY DELETED (also from their progress). This cannot be undone.':'Unpublish this test?'))return;
      if(n)await wipeResults(id,keep,null);
    }
    const tt=tests.find(x=>x.id===id),up={published:v,publishAt:0,sched:false,ver:Date.now()};if(v)up.pubAt=Date.now();if(v&&tt&&tt.publishAt>0)up.deadline=0;
    await db.collection('tests').doc(id).update(up);
  }catch(e){alert('Could not change: '+(e.message||e))}
}
function progress(){normMine();wmOn=false;
  const items=[];Object.keys(mineAll).forEach(k=>mineAll[k].forEach((r,i)=>items.push({...r,id:k,ai:i,n:mineAll[k].length})));items.splice(0,items.length,...items.filter(x=>tests.some(y=>y.id===x.id)));items.sort((a,b)=>b.at-a.at);
  if(!items.length)return h('<h1>My progress</h1><div class="card mut">You haven’t taken any tests yet.</div><button onclick="home()">Back</button>');
  const pct=x=>Math.round(x.score/x.total*100),avg=Math.round(items.reduce((s,x)=>s+pct(x),0)/items.length),best=Math.max(...items.map(pct));
  const box=(v,l)=>`<div class="card" style="flex:1;text-align:center;margin:0"><div class="big" style="font-size:26px">${v}</div><div class="mut">${l}</div></div>`;
  let o=`<h1>My progress</h1><p class="mut">${esc(myName)}</p><div class="row" style="gap:10px;flex-wrap:nowrap">${box(Object.keys(mineAll).length,'Tests taken')}${box(avg+'%','Average')}${box(best+'%','Best')}</div>`;
  items.forEach(x=>{const t=tests.find(y=>y.id===x.id),p=pct(x);
    o+=`<div class="card"><div class="row sp"><b>${esc(t?t.title:'(deleted test)')}${x.n>1?' · Attempt '+(x.ai+1):''}</b><span>${x.score}/${x.total}</span></div><div class="mut">${t?esc(t.section||'Other')+' · ':''}${new Date(x.at).toLocaleDateString()}${x.times?' · ⏱ '+ft(x.times.reduce((a,b)=>a+(b||0),0)):''}</div><div style="background:var(--ac2);border-radius:6px;height:10px;margin:8px 0"><div style="width:${p}%;height:10px;border-radius:6px;background:${p>=60?'var(--ok)':p>=35?'var(--ac)':'var(--bad)'}"></div></div><div class="row sp"><span class="mut">${p}%</span>${t?`<button class="sec" onclick="showReview('${x.id}','p',${x.ai})">Review answers</button>`:''}</div></div>`});
  h(o+`<button onclick="home()">Back</button>`);
}
const ft=s=>{s=Math.round(s||0);return s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s'};
const qTag=(q,a,times,i)=>{const sk=a==null||a<0,ok=a===q.answer,c=sk?'#6b7280':ok?'#15803d':'#c62828';return `<div class="row sp" style="margin-bottom:6px;flex-wrap:nowrap"><span class="mut">${times&&times[i]!=null?'⏱ '+ft(times[i]):''}</span><span style="background:${c};color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:12px">${sk?'– Not attempted':ok?'✓ Correct':'✗ Wrong'}</span></div>`};
const tmBadge=(a,i)=>a&&a[i]!=null?`<span class="mut" style="float:right">⏱ ${ft(a[i])}</span>`:'';
function timeChips(t,x){
  if(!x.times)return '<div class="mut">Time not recorded</div>';
  const tot=x.times.reduce((a,b)=>a+(b||0),0),an=x.answers||[];
  return `<div class="mut" style="margin-bottom:6px">⏱ Total time: <b>${ft(tot)}</b></div><div class="row" style="gap:6px">${t.questions.map((q,i)=>{const sk=an[i]<0,ok=an[i]===q.answer;return `<span style="padding:3px 8px;border-radius:8px;background:var(--ac2);font-size:13px">Q${i+1} <span style="color:var(--${sk?'mut':ok?'ok':'bad'})">${sk?'–':ok?'✓':'✗'}</span> ${ft(x.times[i]||0)}</span>`}).join('')}</div>`;
}
function showReview(id,from,k){normMine();wmOn=true;
  const t=tests.find(x=>x.id===id),rec=(k!=null&&k!==''&&mineAll[id])?mineAll[id][k]:mine[id];if(!t||!rec)return;
  const ans=rec.answers||[],times=rec.times||[];
  let o=`<h1>${esc(t.title)}${(mineAll[id]||[]).length>1?' – Attempt '+(rec.attempt||1):''}</h1><div class="card" style="text-align:center"><div class="big">${rec.score}/${rec.total}</div></div>${brk(t,rec)}`;
  t.questions.forEach((q,i)=>{o+=`<div class="card">${qTag(q,ans[i],times,i)}<b>${i+1}. ${fmt(q.q)}</b>${imgQ(q)}`;q.options.forEach((op,j)=>o+=`<div class="opt ${j===q.answer?'right':(j===ans[i]?'wrong':'')}">${optHtml(q,j)}${j===q.answer?' ✓':''}${j===ans[i]&&j!==q.answer?' ✗':''}</div>`);o+='</div>'});
  h(o+`<button onclick="${from==='p'?'progress()':'home()'}">Back</button>`);
}
async function hardRefresh(){
  if(timer&&!confirm('Test chal raha hai. Refresh karne se test band ho sakta hai. Phir bhi refresh karein?'))return;
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k)}}catch(e){}
  location.replace(location.pathname+'?r='+Date.now());
}
let hiddenAt=0,swReg=null,hadSW=false;
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')){hadSW=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!timer&&!draft)location.reload()})}}catch(e){}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(!uid||!hiddenAt||Date.now()-hiddenAt<15000)return;
  hiddenAt=0;try{swReg&&swReg.update()}catch(e){}
  if(timer||draft||(viewKind!=='root'&&viewKind!=='sec'))return;
  try{await refreshMine()}catch(e){}
  if(!timer&&!draft){const y=window.scrollY;home();window.scrollTo(0,y)}
});
init();
</script>
